<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studieplanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F4F0;
  --surface: #FFFFFF;
  --surface-2: #FAFAF8;
  --ink: #1E2124;
  --ink-soft: #5B5F66;
  --ink-faint: #8B8F96;
  --border: #E4E2DA;
  --border-strong: #CFCCC2;
  --primary: #2E335A;
  --primary-hover: #3D4373;
  --primary-soft: #E9E9F2;
  --done: #2E7D32;
  --done-soft: #E3F2E4;
  --block: #757575;
  --school-blue: #D6E6F7;
  --school-red: #E8ADAD;
  --pause-bg: #DCEFDC;
  --pause-border: #82C08A;
  --overdue: #FFCDD2;
  --overdue-ink: #E53935;
  --soon: #FFF9C4;
  --soon-ink: #8D6E00;
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;
  --shadow: 0 1px 2px rgba(30,33,36,0.06), 0 4px 16px rgba(30,33,36,0.06);
  --shadow-lift: 0 8px 28px rgba(30,33,36,0.16);
  font-size: 16px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  font-feature-settings: "tnum" 1;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .display {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; }

/* ---------- Topbar ---------- */
.topbar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 22px 28px 6px;
  flex-wrap: wrap;
  gap: 8px;
}
.topbar-title-group { display: flex; align-items: baseline; gap: 10px; }
.topbar h1 { font-size: 26px; color: var(--primary); }
.topbar .tagline { font-size: 13px; color: var(--ink-faint); font-style: italic; }
@media (max-width: 480px) {
  .topbar .tagline { display: none; } /* zuiver decoratief, hoeft niet op een smal scherm */
}

/* ---------- Tabs ---------- */
.tabs {
  display: flex;
  gap: 4px;
  padding: 0 24px;
  border-bottom: 1.5px solid var(--border-strong);
  overflow-x: auto;
}
.tab-btn {
  background: none;
  border: none;
  padding: 12px 16px 10px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  transition: color .15s ease, border-color .15s ease;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

main { padding: 22px 24px 60px; max-width: 1400px; margin: 0 auto; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ---------- Generic building blocks ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  box-shadow: var(--shadow);
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  margin: 0 0 8px;
}
.tips-list { margin: 0 0 24px; padding-left: 20px; }
.tips-list li { margin-bottom: 10px; line-height: 1.55; font-size: 13.5px; color: var(--ink); }
.tips-list li:last-child { margin-bottom: 0; }
.hint {
  font-size: 12.5px;
  color: var(--ink-faint);
  font-style: italic;
  line-height: 1.5;
}
.quote-line {
  font-family: "Fraunces", Georgia, serif;
  font-size: 20px;
  color: var(--primary);
  font-style: italic;
  margin: 0 0 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.quote-author { font-size: 12.5px; color: var(--ink-faint); font-style: normal; }
.planning-header-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px; flex-wrap: wrap; gap: 8px;
}
.planning-header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-m); overflow: hidden; }
.view-toggle-btn {
  border: none; background: var(--surface); color: var(--ink-faint); padding: 6px 12px;
  font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .1s ease, color .1s ease;
}
.view-toggle-btn:first-child { border-right: 1px solid var(--border); }
.view-toggle-btn.active { background: var(--primary); color: #fff; }
.view-toggle-btn:not(.active):hover { background: var(--surface-2); }
.task-list-view { display: flex; flex-direction: column; gap: 8px; min-height: 200px; }
.task-list-view .task-chip { width: 100%; box-sizing: border-box; }
.legend {
  font-size: 11.5px;
  color: var(--ink-faint);
  line-height: 1.6;
  padding: 8px 0 4px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-s);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-weight: 600;
  font-size: 13.5px;
  color: var(--ink);
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-faint); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-danger { border-color: #E5A2A2; color: #B71C1C; }
.btn-danger:hover { background: #FFF0F0; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

label.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
input[type=text], input[type=number], input[type=date], input[type=time], textarea, select {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid var(--border-strong);
  border-radius: var(--radius-s);
  background: var(--surface);
  color: var(--ink);
}
textarea { resize: vertical; min-height: 60px; }
.checkbox-row { display: flex; align-items: center; gap: 7px; font-size: 13.5px; }
.checkbox-row input { width: auto; }

.field { margin-bottom: 12px; }
.field-row { display: flex; gap: 12px; }
.field-row > .field { flex: 1; }

table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data-table th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--ink-faint); border-bottom: 1.5px solid var(--border-strong); padding: 8px 10px;
}
table.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.data-table tr.row-overdue td { background: var(--overdue); }
table.data-table tr.row-soon td { background: var(--soon); }
table.data-table tr.row-done td:not(:last-child) { text-decoration: line-through; text-decoration-thickness: 1.5px; }
table.data-table tr:hover td { filter: brightness(0.98); }

.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }

.empty-state { padding: 28px 16px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(20,20,24,0.45);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
  padding: 20px;
}
.modal {
  background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow-lift);
  width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto;
  padding: 22px 24px;
}
.modal h2 { font-size: 19px; margin-bottom: 14px; }
.modal .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.modal .table-scroll { margin: 0 -4px; padding: 0 4px; }
.modal .table-scroll table.data-table { min-width: 480px; }
.modal-close { position: absolute; }

/* ---------- Subjects tab ---------- */
.subject-toolbar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
.subject-toolbar .field { margin-bottom: 0; min-width: 220px; }
.subjects-layout { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.pinned-subjects-col {
  display: flex; flex-direction: column; gap: 10px; width: 150px; flex-shrink: 0;
  padding-right: 14px; margin-right: 4px; border-right: 1px solid var(--border);
}
.subject-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; flex: 1; min-width: 150px; }
.subject-tile { position: relative; }
.subject-btn {
  border: none; border-radius: var(--radius-m); padding: 16px 40px 16px 14px; color: #fff; font-weight: 700;
  font-size: 14px; text-align: left; box-shadow: var(--shadow); min-height: 64px; width: 100%;
  display: flex; align-items: center; transition: transform .08s ease, box-shadow .08s ease;
}
.subject-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.subject-edit-btn {
  position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
  background: rgba(255,255,255,0.28); border: none; color: #fff; font-size: 12px;
  display: flex; align-items: center; justify-content: center; transition: background .12s ease;
}
.subject-edit-btn:hover { background: rgba(255,255,255,0.5); }
.lang-flag {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 3px; overflow: hidden; margin-right: 6px; vertical-align: middle;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.25), 0 1px 2px rgba(0,0,0,0.2);
}
.lang-flag svg { display: block; }

/* ---------- Today tab ---------- */
.streak-line { font-size: 14.5px; font-weight: 700; margin: 8px 0 2px; }
.streak-active, .streak-warning { color: #B45309; }
.streak-neutral { color: var(--ink-soft); font-weight: 500; font-style: italic; }
.progress-row { display: flex; align-items: center; gap: 12px; margin: 10px 0 20px; }
.all-done-banner {
  background: var(--done-soft); color: var(--done); border: 1.5px solid var(--done);
  border-radius: var(--radius-m); padding: 12px 16px; font-weight: 700; font-size: 14.5px;
  margin: -8px 0 20px;
}
.big-task-reminder { margin: -8px 0 20px; display: flex; flex-direction: column; gap: 8px; }
.reminder-line {
  background: var(--soon); color: var(--soon-ink); border: 1.5px solid var(--soon-ink);
  border-radius: var(--radius-m); padding: 10px 14px; font-size: 13.5px; font-weight: 500; margin: 0;
}
.reminder-line strong { font-weight: 800; }
.progress-track { flex: 1; height: 10px; border-radius: 999px; background: var(--border); overflow: hidden; }
.progress-fill { height: 100%; background: var(--done); border-radius: 999px; transition: width .3s ease; }
.progress-label { font-size: 12.5px; color: var(--ink-soft); white-space: nowrap; font-weight: 600; }

/* ---------- Planning tab ---------- */
.planning-layout { display: grid; grid-template-columns: minmax(260px, 320px) 1fr; gap: 18px; align-items: start; }
.planning-layout > div { min-width: 0; }
.matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quadrant { border-radius: var(--radius-m); overflow: hidden; box-shadow: var(--shadow); background: var(--surface); }
.quadrant-header { padding: 8px 10px; font-size: 12px; font-weight: 700; line-height: 1.3; }
.quadrant-header .sub { display: block; font-weight: 500; font-size: 10.5px; opacity: .9; }
.quadrant-body { min-height: 120px; max-height: 260px; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.quadrant-body.drag-over { background: var(--primary-soft); }
.task-chip {
  border-radius: var(--radius-s); padding: 6px 8px; font-size: 11.5px; color: #fff; font-weight: 600;
  cursor: grab; line-height: 1.35; box-shadow: 0 1px 2px rgba(0,0,0,.15);
}
.task-chip:active { cursor: grabbing; }
.task-chip .deadline-flag { display: block; font-weight: 700; font-size: 10.5px; margin-bottom: 1px; }

.cal-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.cal-range { font-weight: 700; font-size: 13.5px; }
.cal-scroll {
  max-height: 620px; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-m);
  background: var(--surface); -webkit-overflow-scrolling: touch;
}
.cal-scroll-hint { display: none; }
.tabs-scroll-hint { display: none; }
@media (max-width: 700px) {
  .cal-scroll-hint, .tabs-scroll-hint {
    display: block; font-size: 12.5px; color: var(--ink-faint); font-style: italic;
    text-align: center; margin: 4px 0 8px;
  }
}
.cal-grid { display: grid; grid-template-columns: 54px repeat(7, minmax(118px, 1fr)); }
.cal-head-cell {
  position: sticky; top: 0; background: var(--surface-2); z-index: 2;
  font-size: 11px; font-weight: 700; text-align: center; padding: 8px 4px;
  border-bottom: 1.5px solid var(--border-strong); border-left: 1px solid var(--border);
}
.cal-head-cell.today { background: var(--soon); }
.cal-head-cell.time-col-head { border-left: none; }
.cal-time-label {
  font-size: 10.5px; color: var(--ink-faint); text-align: right; padding: 4px 6px 0 0;
  border-top: 1px solid var(--border);
}
.cal-cell {
  border-top: 1px solid var(--border); border-left: 1px solid var(--border);
  min-height: 40px; padding: 2px; display: flex; flex-direction: column; gap: 2px;
  cursor: crosshair; user-select: none;
}
.cal-cell.drag-over { background: var(--primary-soft); }
.cal-cell.selecting { background: var(--primary-soft); box-shadow: inset 0 0 0 1.5px var(--primary); }
.cal-cell.tap-pending { background: var(--primary-soft); box-shadow: inset 0 0 0 2px var(--primary); animation: tapPendingPulse 1.1s ease-in-out infinite; }
@keyframes tapPendingPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
.cal-task-card, .cal-block-card {
  border-radius: 5px; padding: 4px 6px; font-size: 10.8px; color: #fff; font-weight: 600;
  line-height: 1.3; cursor: grab; box-shadow: 0 1px 2px rgba(0,0,0,.18); position: relative;
}
.cal-task-card.done { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: 0.85; }
.done-badge {
  position: absolute; top: -6px; right: -6px; width: 15px; height: 15px; border-radius: 50%;
  background: #fff; color: var(--done); display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 900; line-height: 1; text-decoration: none;
  box-shadow: 0 1px 3px rgba(0,0,0,.4); border: 1.5px solid var(--done);
}
.cal-task-card.drag-insert-before { box-shadow: inset 0 3px 0 0 var(--primary), 0 1px 2px rgba(0,0,0,.18); }
.cal-task-card.drag-insert-after { box-shadow: inset 0 -3px 0 0 var(--primary), 0 1px 2px rgba(0,0,0,.18); }
.cal-block-card {
  cursor: pointer;
  background-color: var(--block);
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.22) 0px,
    rgba(255,255,255,0.22) 4px,
    transparent 4px,
    transparent 11px
  );
}
.cal-block-card.is-school {
  background-color: var(--school-blue);
  border: 1.5px solid var(--school-red);
  color: var(--ink);
  background-image: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.55) 0px,
    rgba(255,255,255,0.55) 4px,
    transparent 4px,
    transparent 11px
  );
}
.cal-block-card.is-pause {
  background-color: var(--pause-bg);
  border: 1.5px solid var(--pause-border);
  color: var(--ink);
  background-image: radial-gradient(rgba(255,255,255,0.6) 1.5px, transparent 1.5px);
  background-size: 9px 9px;
}
.cal-block-card.is-other {
  background-color: var(--block) !important;
}
.cal-task-card.is-pause-task, .task-chip.is-pause-task, .subject-btn.is-pause-task {
  background-color: var(--pause-bg) !important;
  background-image: radial-gradient(rgba(255,255,255,0.6) 1.5px, transparent 1.5px) !important;
  background-size: 9px 9px !important;
  border: 1.5px solid var(--pause-border);
  color: var(--ink) !important;
}
.cal-task-card.is-other-task, .task-chip.is-other-task, .subject-btn.is-other-task {
  background-color: var(--block) !important;
}
.cal-task-card.overdue { box-shadow: 0 0 0 2.5px var(--overdue-ink), 0 1px 2px rgba(0,0,0,.18); }
.cal-task-card .deadline-flag { display: block; font-weight: 700; font-size: 9.5px; margin-bottom: 1px; }
.cal-task-card:active { cursor: grabbing; }

/* ---------- List tab ---------- */
.search-row { display: flex; gap: 8px; margin-bottom: 14px; max-width: 420px; }
.search-row input { flex: 1; }

/* ---------- Completed tab ---------- */
.total-line { font-weight: 700; font-size: 14px; margin: 10px 0 20px; }
.chart-wrap { display: flex; align-items: flex-end; gap: 18px; height: 190px; padding: 10px 6px 0; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); }
.chart-bar-group { display: flex; flex-direction: column; align-items: center; min-width: 56px; height: 100%; justify-content: flex-end; }
.chart-bar { width: 44px; border-radius: 5px 5px 0 0; transition: height .3s ease; }
.chart-value { font-size: 10.5px; font-weight: 700; margin-bottom: 3px; }
.chart-label { font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; text-align: center; max-width: 62px; }

/* ---------- Review tab ---------- */
.quality-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- Timer ---------- */
.timer-display { font-family: "Fraunces", serif; font-size: 52px; text-align: center; font-weight: 600; margin: 14px 0; color: var(--primary); }
.timer-mode { text-align: center; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
.timer-settings { display: flex; gap: 14px; justify-content: center; align-items: center; margin: 10px 0; font-size: 13px; }
.timer-settings input { width: 56px; text-align: center; }
.timer-controls { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }

/* ---------- misc ---------- */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 900px) {
  .planning-layout { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
}
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lift); z-index: 1200;
  opacity: 0; transition: opacity .25s ease;
  display: flex; align-items: center; gap: 14px; white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast-action {
  background: none; border: none; color: #fff; font-weight: 800; font-size: 13px;
  text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap;
}
.toast-action:hover { opacity: 0.75; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title-group">
    <h1>Studieplanner</h1>
    <span class="tagline">plannen &middot; doen &middot; onthouden</span>
  </div>
  <button class="btn btn-sm" id="tipsBtn">💡 Tips</button>
</header>

<nav class="tabs" id="tabNav"></nav>
<p class="tabs-scroll-hint">↔️ Veeg opzij voor meer tabbladen</p>

<main id="tabContent">
  <section id="tab-subjects" class="tab-panel"></section>
  <section id="tab-today" class="tab-panel"></section>
  <section id="tab-planning" class="tab-panel"></section>
  <section id="tab-list" class="tab-panel"></section>
  <section id="tab-completed" class="tab-panel"></section>
  <section id="tab-review" class="tab-panel"></section>
</main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script id="core-logic">
// ============================================================================
// Studieplanner — kernlogica (datamodel + business rules)
// Wordt hieronder getest met Node, en later ingebed in het uiteindelijke
// standalone HTML-bestand (met localStorage i.p.v. de STORAGE stub hieronder).
// ============================================================================

const SUBJECT_COLOR_PALETTE = [
    "#4C72B0", "#DD8452", "#C44E52", "#8172B2", "#937860", "#DA8BC3",
    "#4E79A7", "#F28E2B", "#B07AA1", "#9C755F", "#5B4E8C", "#D62728",
    "#E377C2", "#7F7F7F", "#54A24B", "#EDC948",
];
const DONE_COLOR = "#2E7D32";

// Bepaalt of witte of donkere tekst best leesbaar is op een gegeven
// achtergrondkleur (relatieve luminantie, WCAG-formule). Nodig sinds het
// palet ook lichte kleuren (zoals geel) kan bevatten waar witte tekst op
// zou verdrinken.
function getContrastTextColor(hexColor) {
    const r = parseInt(hexColor.slice(1, 3), 16) / 255;

function migrateTaskSessions() {
    // Oudere versies van de app kenden elke taak maar 1 plandatum/-tijd toe
    // (plannedDate/plannedTime). Zet dat om naar de nieuwe sessies-array zodat
    // bestaande, al opgeslagen planningen niet verloren gaan.
    let changed = false;
    state.tasks.forEach(t => {
        if (!Array.isArray(t.sessions)) {
            t.sessions = [];
            if (t.plannedDate) {
                t.sessions.push({
                    id: nextId(), date: t.plannedDate, time: t.plannedTime || "09:00",
                    minutes: t.estimatedMinutes || 30,

            }
            delete t.plannedDate;
            delete t.plannedTime;
            changed = true;
        }
    });
    if (changed) saveState();
}
function migrateSessionDoneStatus() {
    // BUG-FIX/migratie: v\u00f3\u00f3r de per-sessie 'klaar'-tracking stond de status
    // enkel op de taak zelf (t.status === "done"), niet op de individuele
    // sessies. Zonder deze migratie zou een taak die een leerling v\u00f3\u00f3r deze
    // update al had afgevinkt, na het bijwerken plots als "niet klaar" tonen
    // in de kalender/lijst (die nu de sessie-eigen status gebruiken) -- ook al
    // staat de taak zelf nog gewoon op "done". Zet daarom bij het laden alle
    // sessies van een al-afgewerkte taak retroactief op done=true, en geeft
    // elke sessie sowieso een expliciete done/completedAt-waarde (i.p.v.
    // undefined) voor consistentie.
    let changed = false;
    state.tasks.forEach(t => {
        (t.sessions || []).forEach(s => {
            if (s.done === undefined) { s.done = false; changed = true; }
            if (s.completedAt === undefined) { s.completedAt = null; changed = true; }
            if (t.status === "done" && !s.done) {
                s.done = true;
                s.completedAt = s.completedAt || t.completedAt || isoFromDate(new Date());
                changed = true;
            }
        });
    });
    if (changed) saveState();
}
function nextId() {
    const id = state.nextId;
    state.nextId += 1;
    return id;
}

function colorDistance(hex1, hex2) {

    const r1 = parseInt(hex1.slice(1, 3), 16), g1 = parseInt(hex1.slice(3, 5), 16), b1 = parseInt(hex1.slice(5, 7), 16);
    const r2 = parseInt(hex2.slice(1, 3), 16), g2 = parseInt(hex2.slice(3, 5), 16), b2 = parseInt(hex2.slice(5, 7), 16);
    const rmean = (r1 + r2) / 2;
    const dr = r1 - r2, dg = g1 - g2, db = b1 - b2;
    return Math.sqrt((2 + rmean / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rmean) / 256) * db * db);

function reassignSubjectColors() {

        const key = s.name.trim().toLowerCase();
        if (FIXED_SUBJECT_COLORS[key]) {

            usedColors.push(s.color);

    // 2. Overige vakken (behalve Pauze/Andere, die hun eigen vaste styling
    //    via CSS krijgen en waarvoor de kleur dus niet zichtbaar is) krijgen
    //    telkens de paletkleur die het VERST verwijderd is van alle reeds
    //    toegekende kleuren tot dan toe \u2014 zo lijken nooit twee vakken toevallig
    //    erg op elkaar, ook niet met veel vakken tegelijk.
    state.subjects.forEach(s => {
        const key = s.name.trim().toLowerCase();
        if (FIXED_SUBJECT_COLORS[key]) return; // al gedaan
        if (key === "pauze") { s.color = SUBJECT_COLOR_PALETTE[0]; return; }
        if (key === "andere") { s.color = SUBJECT_COLOR_PALETTE[1]; return; }
        let best = SUBJECT_COLOR_PALETTE[0], bestScore = -1;
        SUBJECT_COLOR_PALETTE.forEach(candidate => {
            const minDist = usedColors.length ? Math.min(...usedColors.map(u => colorDistance(candidate, u))) : Infinity;

    });

// ---------------------------------------------------------------------------
// Sessies: een taak kan over meerdere momenten opgesplitst ingepland worden
// (bv. 60 min geschat -> 2x 30 min op verschillende dagen), zonder de taak
// zelf meerdere keren te moeten aanmaken.

function getTaskRemainingMinutes(task) {

    return Math.max(0, (task.estimatedMinutes || 0) - planned);

    // Normaal gezien verdwijnt een als 'klaar' gemarkeerde taak uit de matrix,
    // maar bij een taak die in meerdere sessies verspreid wordt ingepland
    // (bv. "Pauze" met 1000 min, waarvan pas 60 min gepland is) kan je \u00e9\u00e9n
    // sessie als klaar markeren (dubbelklik in de kalender) terwijl er nog
    // veel resterende tijd is \u2014 die resterende tijd moet dan gewoon in de
    // matrix blijven staan om verder in te plannen, i.p.v. helemaal te
    // verdwijnen.
    const remaining = getTaskRemainingMinutes(task);

    // de situatie speelt (geen achtergrondmeldingen mogelijk in een gewone

    return state.tasks

            const urgency = deadlineUrgency(t.deadline);
            return urgency === "soon" || urgency === "overdue";

    t.actualMinutes = (t.actualMinutes || 0) + minutes;
    saveState();
}
function markTaskDone(id) {
    const t = getTask(id); if (!t) return;
    const today = isoFromDate(new Date());
    const wasAlreadyDone = t.status === "done";
    if (t.sessions && t.sessions.length > 0) {
        t.sessions.forEach(s => { s.done = true; s.completedAt = today; });
    }
    t.status = "done";
    t.completedAt = today;
    if (!wasAlreadyDone) _onTaskFullyCompleted(t);
    saveState();
}
function toggleTaskDone(id) {
    const t = getTask(id); if (!t) return;
    if (t.status === "done") {
        t.status = (t.sessions && t.sessions.length > 0) ? "planned" : "open";
        t.completedAt = null;
        if (t.sessions) t.sessions.forEach(s => { s.done = false; s.completedAt = null; });
        saveState();
    } else {
        markTaskDone(id);
    }
}
function getCompletedTasksBetween(startIso, endIso) {
    const rows = [];
    state.tasks.forEach(t => {
        const sessions = t.sessions || [];
        if (sessions.length > 0) {
            // Elke afgevinkte sessie telt als een eigen rij, met haar eigen datum
            // en minuten -- zo blijft "Deze week gedaan" correct ook wanneer een
            // taak in meerdere sessies opgesplitst is en die op verschillende
            // dagen afgewerkt worden.
            const doneSessions = sessions.filter(s => s.done && s.completedAt);
            // 'actualMinutes' (de effectief gelogde tijd) staat op taakniveau, niet
            // per sessie -- die mag dus maar bij \u00e9\u00e9n rij horen (de meest recente),
            // anders zou hetzelfde getal meermaals meetellen in het weektotaal.
            const mostRecentDoneId = doneSessions.length
                ? doneSessions.reduce((a, b) => (a.completedAt > b.completedAt ? a : b)).id
                : null;
            doneSessions.forEach(s => {
                if (s.completedAt >= startIso && s.completedAt <= endIso) {
                    rows.push({
                        ...t, sessionId: s.id, sessionTime: s.time, sessionCount: 1,
                        completedAt: s.completedAt, completedMinutes: s.minutes,
                        actualMinutes: s.id === mostRecentDoneId ? t.actualMinutes : 0,
                    });
                }
            });
        } else if (t.status === "done" && t.completedAt && t.completedAt >= startIso && t.completedAt <= endIso) {
            // Rechtstreeks als klaar afgevinkt zonder ooit gepland te zijn geweest.
            rows.push({ ...t, sessionId: null, sessionTime: null, sessionCount: 0, completedMinutes: t.estimatedMinutes || 0 });
        }
    });
    return rows.sort((a, b) => (a.completedAt + (a.sessionTime || "")).localeCompare(b.completedAt + (b.sessionTime || "")));
}

// ---------------------------------------------------------------------------
// Studiereeks ("streak"): aantal opeenvolgende dagen met minstens 1 afgewerkte
// taak/sessie — puur motivationeel, gebaseerd op completedAt-datums.
// ---------------------------------------------------------------------------
function getCompletionDateSet() {
    const set = new Set();
    state.tasks.forEach(t => {
        const sessions = t.sessions || [];
        if (sessions.length > 0) {
            sessions.forEach(s => { if (s.done && s.completedAt) set.add(s.completedAt); });
        } else if (t.status === "done" && t.completedAt) {
            set.add(t.completedAt);
        }
    });
    return set;
}
function getCurrentStreak(todayIso) {
    todayIso = todayIso || isoFromDate(new Date());
    const dates = getCompletionDateSet();
    let anchor = todayIso;
    let anchoredToday = true;
    if (!dates.has(anchor)) {
        const yesterday = addDays(todayIso, -1);
        if (dates.has(yesterday)) { anchor = yesterday; anchoredToday = false; }
        else return { streak: 0, anchoredToday: true };
    }
    let streak = 0;
    let day = anchor;
    while (dates.has(day)) {
        streak++;
        day = addDays(day, -1);
    }
    return { streak, anchoredToday };
}
function getLongestStreak() {
    const dates = Array.from(getCompletionDateSet()).sort();
    if (!dates.length) return 0;
    let longest = 1, current = 1;
    for (let i = 1; i < dates.length; i++) {
        current = daysBetween(dates[i - 1], dates[i]) === 1 ? current + 1 : 1;
        if (current > longest) longest = current;
    }
    return longest;
}

function guessSubjectIcon(name) {
    // Geeft {type: "emoji"|"lang", value} terug, of null. Talen krijgen bewust
    // GEEN vlag-emoji (die renderen op sommige systemen enkel als losse letters
    // zoals "FR" i.p.v. een echte vlag) maar een eigen CSS-badge met landcode,
    // dat werkt overal betrouwbaar hetzelfde.
    // Korte afkortingen (zoals "LO") worden enkel EXACT herkend, niet als los
    // stukje tekst binnenin een andere naam (anders zou bv. "Biologie" per
    // ongeluk ook matchen, want dat woord bevat toevallig ook "lo").
    const lower = (name || "").trim().toLowerCase();
    for (const entry of SUBJECT_ICON_KEYWORDS) {
        if (entry.keywords.some(k => (k.length <= 2 ? lower === k : lower.includes(k)))) return { type: entry.type, value: entry.value };
    }
    return null;
}

function deadlineUrgency(deadline) {
    if (!deadline) return null;
    const diff = daysBetween(isoFromDate(new Date()), deadline);
    if (diff < 0) return "overdue";
    if (diff <= 2) return "soon";
    return null;
}

// ---------------------------------------------------------------------------
// Geblokkeerde tijdslots (wekelijks terugkerend of eenmalig)
// ---------------------------------------------------------------------------
function addRecurringBlock(weekday, blockStart, label, duration = 60) {
    state.blockedSlots = state.blockedSlots.filter(b => !(b.specificDate == null && b.weekday === weekday && b.blockStart === blockStart));
    state.blockedSlots.push({ id: nextId(), weekday, specificDate: null, blockStart, label, duration: duration || 60 });
    saveState();
}
function addOnetimeBlock(specificDate, blockStart, label, duration = 60) {
    state.blockedSlots = state.blockedSlots.filter(b => !(b.specificDate === specificDate && b.blockStart === blockStart));
    state.blockedSlots.push({ id: nextId(), weekday: null, specificDate, blockStart, label, duration: duration || 60 });
    saveState();
}
function removeRecurringBlock(weekday, blockStart) {
    // Verwijdert de wekelijkse regel volledig (voor alle weken), inclusief
    // eventuele losse uitzonderingen die ervoor gemaakt waren (die zijn dan zinloos).
    state.blockedSlots = state.blockedSlots.filter(b => !(b.specificDate == null && b.weekday === weekday && b.blockStart === blockStart));
    saveState();
}
function removeOnetimeBlock(specificDate, blockStart) {
    state.blockedSlots = state.blockedSlots.filter(b => !(b.specificDate === specificDate && b.blockStart === blockStart));
    saveState();
}
function skipRecurringBlockForDate(weekday, blockStart, specificDate) {
    // "Verwijder enkel deze week": de wekelijkse regel blijft bestaan voor
    // alle ANDERE weken, maar geldt bewust niet op deze ene datum. Dat wordt
    // opgeslagen als een eenmalige uitzondering met label=null.
    state.blockedSlots = state.blockedSlots.filter(b => !(b.specificDate === specificDate && b.blockStart === blockStart));
    state.blockedSlots.push({ id: nextId(), weekday: null, specificDate, blockStart, label: null, duration: null });
    saveState();
}
function removeBlockedRange(dayIndex, dayIso, blockStarts, mode) {
    // Verwijdert meerdere (aaneengesloten) uren in \u00e9\u00e9n keer, bv. na een
    // sleep-selectie of twee-tikken-selectie over meerdere uren. Werkt met een
    // MIX van eenmalige en wekelijkse blokken binnen hetzelfde bereik:
    // - eenmalige blokken worden altijd volledig verwijderd
    // - wekelijkse regels volgen 'mode': "week" (enkel deze week, de regel
    //   blijft bestaan voor andere weken) of "all" (de hele wekelijkse regel)
    // Uren zonder blok binnen het bereik worden gewoon overgeslagen.
    let count = 0;
    blockStarts.forEach(bs => {
        const existing = getBlockedSlotForDay(dayIso, dayIndex, bs);
        if (!existing) return;
        if (existing.isOnetime) {
            removeOnetimeBlock(dayIso, bs);
        } else if (mode === "all") {
            removeRecurringBlock(dayIndex, bs);
        } else {
            skipRecurringBlockForDate(dayIndex, bs, dayIso);

}
function getRecurringBlockLabels() {
    // Unieke labels van alle wekelijks terugkerende blokken (bv. "School",
    // "Sporttraining"), voor een dropdown i.p.v. vrije tekst bij het in bulk
    // vrijmaken van een periode.
    const set = new Set();
    state.blockedSlots.filter(b => b.specificDate == null).forEach(b => set.add(b.label));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "nl"));
}
function skipRecurringBlockForDateRange(label, startDate, endDate) {
    // Verwijdert alle voorkomens van een wekelijks blok met dit label, voor
    // elke dag tussen startDate en endDate (incl.) \u2014 handig om in \u00e9\u00e9n keer
    // een hele vakantie- of examenperiode vrij te maken. De wekelijkse regel
    // zelf blijft bestaan voor alle weken BUITEN deze periode.
    const lowerLabel = label.trim().toLowerCase();
    const matchingRules = state.blockedSlots.filter(b => b.specificDate == null && b.label.trim().toLowerCase() === lowerLabel);
    let count = 0;
    let cursor = startDate;
    while (cursor <= endDate) {
        const wd = weekdayIndex(cursor);
        matchingRules.filter(r => r.weekday === wd).forEach(r => {
            const alreadyBlockedElsewhere = state.blockedSlots.some(b => b.specificDate === cursor && b.blockStart === r.blockStart);
            if (!alreadyBlockedElsewhere) {
                state.blockedSlots.push({ id: nextId(), weekday: null, specificDate: cursor, blockStart: r.blockStart, label: null, duration: null });
                count++;
            }
        });
        cursor = addDays(cursor, 1);
    }
    saveState();
    return count;
}
function clearBlockException(weekday, blockStart) {
    // Wanneer een wekelijkse regel opnieuw ingesteld wordt, ruimt dit ALLE
    // eerder gemaakte "enkel deze week verwijderd"-uitzonderingen op voor
    // deze weekdag+tijdstip, ongeacht de specifieke datum -- anders zouden
    // andere weken die eerder ook vrijgemaakt waren (bv. de tweede week van
    // een langere examenperiode) stiekem leeg blijven staan, ook al staat de
    // wekelijkse regel er intussen gewoon weer (BUG-FIX: voorheen werd enkel
    // de uitzondering van de \u00e9\u00e9n specifieke week opgeruimd die net bekeken werd).
    state.blockedSlots = state.blockedSlots.filter(b => {
        if (b.label !== null) return true; // geen uitzondering, gewoon laten staan
        if (b.blockStart !== blockStart) return true;
        if (b.specificDate == null) return true;
        return weekdayIndex(b.specificDate) !== weekday;
    });
    saveState();
}
function getBlockedSlotForDay(dayIso, weekday, blockStart) {
    const once = state.blockedSlots.find(b => b.specificDate === dayIso && b.blockStart === blockStart);
    if (once) {
        if (once.label === null) return null; // uitzondering: bewust NIET geblokkeerd op deze dag
        return { label: once.label, isOnetime: true, duration: once.duration || 60 };
    }
    const weekly = state.blockedSlots.find(b => b.specificDate == null && b.weekday === weekday && b.blockStart === blockStart);
    if (weekly) return { label: weekly.label, isOnetime: false, duration: weekly.duration || 60 };
    return null;
}
function getBlockedMapForWeek(mondayIso) {
    const map = {};
    state.blockedSlots.filter(b => b.specificDate == null).forEach(b => {
        map[`${b.weekday}|${b.blockStart}`] = { label: b.label, isOnetime: false, duration: b.duration || 60 };
    });
    const sundayIso = addDays(mondayIso, 6);
    state.blockedSlots.filter(b => b.specificDate != null && b.specificDate >= mondayIso && b.specificDate <= sundayIso)
        .forEach(b => {
            const dayIndex = daysBetween(mondayIso, b.specificDate);
            if (dayIndex >= 0 && dayIndex <= 6) {
                const key = `${dayIndex}|${b.blockStart}`;
                if (b.label === null) delete map[key]; // uitzondering: haal het wekelijkse blok voor deze dag weg
                else map[key] = { label: b.label, isOnetime: true, duration: b.duration || 60 };
            }
        });
    return map;
}

// ---------------------------------------------------------------------------
// Spaced repetition (SM-2-achtig) + interleaved practice
// ---------------------------------------------------------------------------
function scheduleNextReview(topicId, quality) {
    const top = state.topics.find(t => t.id === topicId);
    if (!top) return;
    let { reviewCount, intervalDays, ease } = top;
    if (quality < 3) {
        reviewCount = 0; intervalDays = 1;
    } else {
        reviewCount += 1;
        if (reviewCount === 1) intervalDays = 1;
        else if (reviewCount === 2) intervalDays = 3;
        else if (reviewCount === 3) intervalDays = 7;
        else intervalDays = Math.max(1, Math.round(intervalDays * ease));
        ease = Math.max(1.3, ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
    }
    const today = isoFromDate(new Date());
    Object.assign(top, {
        reviewCount, intervalDays, ease: Math.round(ease * 100) / 100,
        lastReviewDate: today, nextReviewDate: addDays(today, intervalDays),
    });
    saveState();
}
function getDueTopicsInterleaved() {
    const today = isoFromDate(new Date());
    const due = state.topics.filter(t => t.nextReviewDate <= today)
        .map(t => ({ ...t, subjectName: getSubjectName(t.subjectId) }))
        .sort((a, b) => a.subjectName.localeCompare(b.subjectName) || a.nextReviewDate.localeCompare(b.nextReviewDate));
    const bySubject = {};
    due.forEach(t => { (bySubject[t.subjectName] = bySubject[t.subjectName] || []).push(t); });
    const groups = Object.values(bySubject);
    const interleaved = [];
    for (let i = 0; ; i++) {
        let added = false;
        for (const g of groups) { if (i < g.length) { interleaved.push(g[i]); added = true; } }
        if (!added) break;
    }
    return interleaved;
}
function getAllTopics() {
    return state.topics.map(t => ({ ...t, subjectName: getSubjectName(t.subjectId) }))
        .sort((a, b) => a.nextReviewDate.localeCompare(b.nextReviewDate));
}

// ---------------------------------------------------------------------------
// Back-up (export/import als JSON)
// ---------------------------------------------------------------------------
function exportStateJson() {
    return JSON.stringify(state, null, 2);
}
function importStateJson(jsonText) {
    const parsed = JSON.parse(jsonText);
    if (!parsed || !Array.isArray(parsed.subjects) || !Array.isArray(parsed.tasks)) {
        throw new Error("Onherkenbaar back-upbestand.");
    }
    state = Object.assign(defaultState(), parsed);
    saveState();
}

// exports voor de node-testrunner
if (typeof module !== "undefined") {
    module.exports = {
        SUBJECT_COLOR_PALETTE, DONE_COLOR, BLOCK_COLOR, DAY_NAMES, QUADRANTS, TIME_BLOCKS, QUALITY_LABELS, getContrastTextColor,
        FIXED_SUBJECT_COLORS, PINNED_SUBJECT_ORDER, MAIN_SUBJECT_PRIORITY_ORDER, colorDistance,
        isoFromDate, dateFromIso, addDays, weekStart, weekdayIndex, daysBetween,
        get state() { return state; }, set state(v) { state = v; },
        setStorageBackend,
        loadState, saveState, defaultState,
        addSubject, getSubjects, getSubjectName, getSubjectColor, renameSubject, deleteSubject, reassignSubjectColors,
        addTask, getTask, getTasks, updateTask, deleteTask, planTask, unplanTask,
        getTaskRemainingMinutes, addSession, removeSession, updateSession, setTaskSessions,
        getPlannedTasksBetween, getAllPlannedSessions, addActualMinutes, markTaskDone, toggleTaskDone, toggleSessionDone,
        getCompletedTasksBetween, deadlineUrgency, migrateTaskSessions, migrateSessionDoneStatus, guessSubjectIcon, ensureDefaultSubjects, isTaskOpenForMatrix, reorderSessionsInSlot,
        getBigUnplannedTasksNeedingAttention, BIG_TASK_REMINDER_THRESHOLD_MIN,
        getTaskView, setTaskView,
        saveUndoSnapshot, canUndo, undoLastAction, clearUndoSnapshot,
        getCompletionDateSet, getCurrentStreak, getLongestStreak,
        addRecurringBlock, addOnetimeBlock, removeRecurringBlock, removeOnetimeBlock, skipRecurringBlockForDate, clearBlockException, removeBlockedRange,
        getRecurringBlockLabels, skipRecurringBlockForDateRange,
        getBlockedSlotForDay, getBlockedMapForWeek,
        scheduleNextReview, getDueTopicsInterleaved, getAllTopics,
        exportStateJson, importStateJson,
    };
}

<script id="ui-layer">

function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDate(iso) {
    if (!iso) return "-";
    const [y, m, d] = iso.split("-");
    return `${d}/${m}/${y}`;
}
function showToast(msg, options) {
    const root = document.getElementById("toastRoot");
    const el = document.createElement("div");
    el.className = "toast";
    const msgSpan = document.createElement("span");
    msgSpan.textContent = msg;
    el.appendChild(msgSpan);
    let dismissed = false;
    const dismiss = () => { if (dismissed) return; dismissed = true; el.classList.remove("show"); setTimeout(() => el.remove(), 300); };
    if (options && options.actionLabel && options.onAction) {
        const btn = document.createElement("button");
        btn.className = "toast-action";
        btn.textContent = options.actionLabel;
        btn.addEventListener("click", () => { dismiss(); options.onAction(); });
        el.appendChild(btn);
    }
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add("show"));
    setTimeout(dismiss, options && options.actionLabel ? 6000 : 2200);
}

// ---------------------------------------------------------------------------
// Modal-infrastructuur (stapelbaar: een modal geopend vanuit een andere modal
// — bv. de timer vanuit het bewerkingsvenster — sluit de onderliggende NIET)
// ---------------------------------------------------------------------------
const _modalStack = []; // [{backdrop, cleanup}]
function escCloseHandler(e) { if (e.key === "Escape") closeModal(); }

function openModal(innerHtml, { onMount, onClose } = {}) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.style.zIndex = String(1000 + _modalStack.length);
    backdrop.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${innerHtml}</div>`;
    backdrop.addEventListener("mousedown", (e) => { if (e.target === backdrop) closeModal(); });
    document.getElementById("modalRoot").appendChild(backdrop);
    _modalStack.push({ backdrop, cleanup: onClose || null });
    if (_modalStack.length === 1) document.addEventListener("keydown", escCloseHandler);
    if (onMount) onMount(backdrop.querySelector(".modal"));
}
function closeModal() {
    const top = _modalStack.pop();
    if (!top) return;
    top.backdrop.remove();
    if (top.cleanup) top.cleanup();
    if (_modalStack.length === 0) document.removeEventListener("keydown", escCloseHandler);
}

function renderSubjectsTab() {
    const el = document.getElementById("tab-subjects");
    const allSubjects = getSubjects();
    // Vaste volgorde vooraan: hoofdvakken (indien aangemaakt), dan Pauze, dan Andere.
    const pinnedSubjects = PINNED_SUBJECT_ORDER
        .map(name => allSubjects.find(s => s.name.trim().toLowerCase() === name))
        .filter(Boolean);
    const otherSubjectsAlphabetical = allSubjects.filter(s => !pinnedSubjects.includes(s));
    const priorityFirst = MAIN_SUBJECT_PRIORITY_ORDER
        .map(name => otherSubjectsAlphabetical.find(s => s.name.trim().toLowerCase() === name))
        .filter(Boolean);
    const otherSubjects = [...priorityFirst, ...otherSubjectsAlphabetical.filter(s => !priorityFirst.includes(s))];

    const renderTile = (s) => {
        const isPause = s.name.trim().toLowerCase() === "pauze";
        const isOther = s.name.trim().toLowerCase() === "andere";
        let icon = "";
        if (isPause) {
            icon = "\u23F8\uFE0F ";
        } else {
            const guess = guessSubjectIcon(s.name);
            if (guess) icon = guess.type === "lang" ? `<span class="lang-flag">${LANG_FLAG_SVG[guess.value]}</span> ` : `${guess.value} `;
        }
        return `
          <div class="subject-tile">
            <button class="subject-btn ${isPause ? "is-pause-task" : ""} ${isOther ? "is-other-task" : ""}" style="background:${s.color}; color:${getContrastTextColor(s.color)}" data-subject-id="${s.id}">${icon}${escapeHtml(s.name)}</button>
            <button class="subject-edit-btn" data-edit-subject-id="${s.id}" title="Naam wijzigen of verwijderen">\u2699</button>
          </div>`;
    };

    el.innerHTML = `
      <p class="quote-line">\u201cEen tocht van duizend mijl begint met een enkele stap.\u201d <span class="quote-author">\u2014 Lao Tzu, Tao Te Ching</span></p>
      <div class="subject-toolbar">
        <div class="field"><label class="field-label">Nieuw vak</label><input type="text" id="newSubjectName" placeholder="bv. Wiskunde"></div>
        <button class="btn btn-primary" id="addSubjectBtn">Vak toevoegen</button>
        <button class="btn" id="exportBtn">\u{1F4BE} Back-up maken</button>
        <button class="btn" id="importBtn">\u{1F4C2} Back-up laden</button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none">
      </div>
      <p class="hint">Klik op een vak om taken/leerstof in te voeren of te bekijken. Klik op \u2699 om de naam te wijzigen of het vak te verwijderen.</p>
      <div class="subjects-layout">
        ${pinnedSubjects.length ? `<div class="pinned-subjects-col">${pinnedSubjects.map(renderTile).join("")}</div>` : ""}
        <div class="subject-grid">
          ${otherSubjects.length ? otherSubjects.map(renderTile).join("")
              : (pinnedSubjects.length ? "" : '<div class="empty-state">Nog geen vakken toegevoegd.</div>')}
        </div>
      </div>
    `;
    const nameInput = el.querySelector("#newSubjectName");
    el.querySelector("#addSubjectBtn").addEventListener("click", () => handleAddSubject(nameInput));
    nameInput.addEventListener("keydown", e => { if (e.key === "Enter") handleAddSubject(nameInput); });
    el.querySelectorAll(".subject-btn").forEach(b => b.addEventListener("click", () => openSubjectModal(Number(b.dataset.subjectId))));
    el.querySelectorAll("[data-edit-subject-id]").forEach(b => b.addEventListener("click", (e) => {
        e.stopPropagation();
        openSubjectEditModal(Number(b.dataset.editSubjectId));
    }));
    el.querySelector("#exportBtn").addEventListener("click", handleExport);
    el.querySelector("#importBtn").addEventListener("click", () => el.querySelector("#importFileInput").click());
    el.querySelector("#importFileInput").addEventListener("change", handleImportFile);
}
function openSubjectEditModal(subjectId, onRenamed) {
    const subject = state.subjects.find(s => s.id === subjectId);
    if (!subject) return;
    const taskCount = getTasks({ subjectId }).length;
    const isProtected = ["pauze", "andere"].includes(subject.name.trim().toLowerCase());
    openModal(`
      <h2>Vak bewerken</h2>
      <div class="field"><label class="field-label">Naam</label><input type="text" id="renameSubjectInput" value="${escapeHtml(subject.name)}"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveRenameBtn">Opslaan</button>
        ${isProtected ? "" : '<button class="btn btn-danger" id="deleteSubjectBtn">Vak verwijderen</button>'}
        <button class="btn" data-close>Annuleren</button>
      </div>
      ${isProtected ? '<p class="hint" style="margin-top:10px;">Dit is een standaardvak en kan niet verwijderd worden \u2014 je kan het wel hernoemen.</p>' : ""}
      ${!isProtected && taskCount ? `<p class="hint" style="margin-top:10px;">Verwijderen wist ook alle ${taskCount} taken/leerstof van dit vak.</p>` : ""}
    `, { onMount: (modal) => {
        const input = modal.querySelector("#renameSubjectInput");
        input.focus(); input.select();
        modal.querySelector("[data-close]").addEventListener("click", closeModal);
        modal.querySelector("#saveRenameBtn").addEventListener("click", () => {
            try {
                renameSubject(subjectId, input.value);
                closeModal(); refreshAll(); showToast("Naam gewijzigd");
                if (onRenamed) onRenamed();
            } catch (e) { alert(e.message); }
        });
        input.addEventListener("keydown", e => { if (e.key === "Enter") modal.querySelector("#saveRenameBtn").click(); });
        const deleteBtn = modal.querySelector("#deleteSubjectBtn");
        if (deleteBtn) deleteBtn.addEventListener("click", () => {
            if (confirm(`'${subject.name}' en alle bijhorende taken definitief verwijderen?`)) {
                saveUndoSnapshot();
                deleteSubject(subjectId);
                closeAllModals(); // ook een eventueel onderliggend vak-venster heeft geen zin meer
                refreshAll();
                showToast("Vak verwijderd", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Vak hersteld"); } });
            }
        });
    }});
}
function handleAddSubject(input) {
    try {
        addSubject(input.value);
        input.value = "";
        renderSubjectsTab();
        showToast("Vak toegevoegd");
    } catch (e) { alert(e.message); }
}
function handleExport() {
    const json = exportStateJson();
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "studieplanner_backup.json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("Back-up gedownload");
}
function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            importStateJson(ev.target.result);
            showToast("Back-up geladen");
            refreshAll();
        } catch (err) { alert("Kon back-up niet laden: " + err.message); }
    };
    reader.readAsText(file);
    e.target.value = "";
}

    openModal(`

function renderSubjectTaskList(container, subjectId) {
    const tasks = getTasks({ subjectId });
    if (!tasks.length) { container.innerHTML = '<div class="empty-state">Nog geen taken.</div>'; return; }
    container.innerHTML = `
      <div class="table-scroll">
      <table class="data-table">

          ${tasks.map(t => {

    container.querySelectorAll('[data-action="edit-task"]').forEach(b => b.addEventListener("click", () => {

}

const DAY_NAMES_FULL = ["Maandag", "Dinsdag", "Woensdag", "Donderdag", "Vrijdag", "Zaterdag", "Zondag"];

function renderStreakLine(todayIso) {
    const { streak, anchoredToday } = getCurrentStreak(todayIso);
    const longest = getLongestStreak();
    const dayWord = (n) => (n === 1 ? "dag" : "dagen");
    if (streak === 0) {
        if (longest === 0) {
            return `<span class="streak-neutral">Nog geen studiereeks \u2014 rond vandaag je eerste taak af om te beginnen! \u{1F3AF}</span>`;
        }
        return `<span class="streak-neutral">Reeks onderbroken (beste reeks ooit: ${longest} ${dayWord(longest)}) \u2014 begin vandaag opnieuw!</span>`;
    }
    if (anchoredToday) {
        const record = streak >= longest && longest > 1 ? " \u2014 nieuw record!" : "";
        return `<span class="streak-active">\u{1F525} ${streak} ${dayWord(streak)} op rij!${record}</span>`;
    }
    return `<span class="streak-warning">\u{1F525} ${streak} ${dayWord(streak)} op rij \u2014 rond vandaag nog iets af om je reeks te behouden!</span>`;
}

function renderBigTaskReminder() {
    const tasks = getBigUnplannedTasksNeedingAttention();
    if (!tasks.length) return "";
    return `<div class="big-task-reminder">
      ${tasks.map(t => {
          const urg = deadlineUrgency(t.deadline);
          const urgLabel = urg === "overdue" ? "is al verlopen" : "komt dichtbij";
          const hours = Math.round((t.remainingMinutes / 60) * 10) / 10;
          return `<p class="reminder-line">\u23F0 <strong>${escapeHtml(getSubjectName(t.subjectId))}: ${escapeHtml(t.title)}</strong> \u2014 nog ${hours}u niet ingepland, en de deadline (${fmtDate(t.deadline)}) ${urgLabel}. Plan er alvast een stuk van in.</p>`;
      }).join("")}
    </div>`;
}

function renderTodayTab() {
    const el = document.getElementById("tab-today");
    const today = isoFromDate(new Date());
    const weekday = weekdayIndex(today);
    const monday = weekStart(today);
    const blockedMap = getBlockedMapForWeek(monday);

    const entries = [];
    TIME_BLOCKS.forEach(b => {
        const entry = blockedMap[`${weekday}|${b.start}`];
        const isSchool = entry && entry.label.trim().toLowerCase() === "school";
        if (entry && !isSchool) entries.push({ time: b.start, type: "blok", label: entry.label, isOnetime: entry.isOnetime, duration: entry.duration });
    });
    getPlannedTasksBetween(today, today).forEach(t => {
        const partLabel = t.sessionCount > 1 ? ` \u00b7 deel` : "";
        entries.push({ time: t.time || "??:??", type: "taak", label: getSubjectName(t.subjectId), taskId: t.taskId, sessionId: t.sessionId, sessionDone: t.sessionDone, title: t.title + partLabel, est: t.minutes });
    });
    entries.sort((a, b) => a.time.localeCompare(b.time));

    let doneCount = 0, taskCount = 0;
    entries.forEach(e => { if (e.type === "taak") { taskCount++; if (e.sessionDone) doneCount++; } });

    el.innerHTML = `
      <h2>Vandaag \u2014 ${DAY_NAMES_FULL[weekday]} ${fmtDate(today)}</h2>
      <div class="streak-line">${renderStreakLine(today)}</div>
      <div class="progress-row">
        <div class="progress-track"><div class="progress-fill" style="width:${taskCount ? (doneCount / taskCount * 100) : 0}%"></div></div>
        <div class="progress-label">${taskCount ? `${doneCount}/${taskCount} taken afgewerkt vandaag` : "Nog geen taken gepland vandaag"}</div>
      </div>
      ${taskCount > 0 && doneCount === taskCount ? '<p class="all-done-banner">\u{1F389} Proficiat, je hebt alle taken voor vandaag afgewerkt.</p>' : ""}
      ${renderBigTaskReminder()}
      <h3 class="section-title">Rooster van vandaag</h3>
      <div class="table-scroll" style="margin-bottom:22px;">
      <table class="data-table">
        <thead><tr><th>Tijd</th><th>Type</th><th>Vak/blok</th><th>Taak</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${entries.length ? entries.map(e => {
              if (e.type === "blok") {
                  const isSchool = e.label.trim().toLowerCase() === "school";
                  const icon = isSchool ? "\u{1F3EB}" : (e.isOnetime ? "\u{1F4CC}" : "\u{1F512}");
                  return `<tr style="background:var(--surface-2);"><td>${e.time}</td><td>${icon}</td><td>${escapeHtml(e.label)}${e.duration && e.duration < 60 ? ` (${e.duration}m)` : ""}</td><td colspan="2">\u2014</td><td></td></tr>`;
              }
              const rowClass = e.sessionDone ? "row-done" : "";
              return `<tr class="${rowClass}">
                <td>${e.time}</td><td>taak</td><td>${escapeHtml(e.label)}</td>
                <td>${escapeHtml(e.title)} (${e.est}m)</td><td>${e.sessionDone ? "klaar" : "gepland"}</td>
                <td>
                  <button class="btn btn-sm" data-action="toggle-session" data-task-id="${e.taskId}" data-session-id="${e.sessionId}">${e.sessionDone ? "Heropen" : "Klaar"}</button>
                  <button class="btn btn-sm" data-action="timer" data-id="${e.taskId}">\u23F1</button>
                </td>
              </tr>`;
          }).join("") : '<tr><td colspan="6" class="empty-state">Niets gepland vandaag.</td></tr>'}
        </tbody>
      </table>
      </div>
      <h3 class="section-title">Vandaag te herhalen leerstof</h3>
      <div id="todayReviewWrap"></div>
    `;
    el.querySelectorAll('[data-action="toggle-session"]').forEach(b => b.addEventListener("click", () => {
        toggleSessionDone(Number(b.dataset.taskId), Number(b.dataset.sessionId)); refreshAll(); showToast("Bijgewerkt");
    }));
    el.querySelectorAll('[data-action="timer"]').forEach(b => b.addEventListener("click", () => {
        const task = getTask(Number(b.dataset.id));
        if (task) openTimerModal(task, refreshAll);
    }));
    renderReviewList(el.querySelector("#todayReviewWrap"));
}

            <button class="view-toggle-btn ${currentView === "list" ? "active" : ""}" data-view="list">\u{1F4CB} Lijst</button>
          </div>
          <button class="btn btn-sm" id="freePeriodBtn" title="Vakantie of examens? Maak in \u00e9\u00e9n keer een hele periode vrij">\u{1F334} Periode vrijmaken</button>
          <button class="btn btn-sm" id="planningInfoBtn" title="Hoe werkt dit?">\u2139\uFE0F Hoe werkt dit?</button>
        </div>
      </div>
      <div class="planning-layout">
        <div id="matrixWrap"></div>
        <div id="calendarWrap"></div>
      </div>
    `;
    if (currentView === "list") renderTaskListView(el.querySelector("#matrixWrap"), openTasks);
    else renderMatrix(el.querySelector("#matrixWrap"), openTasks);
    renderCalendar(el.querySelector("#calendarWrap"), blockedMap, plannedRows, todayIso);
    el.querySelector("#planningInfoBtn").addEventListener("click", openPlanningInfoModal);
    el.querySelector("#freePeriodBtn").addEventListener("click", openFreePeriodModal);
    el.querySelectorAll(".view-toggle-btn").forEach(btn => {
        btn.addEventListener("click", () => { setTaskView(btn.dataset.view); renderPlanningTab(); });
    });
}

function renderTaskChipHtml(t) {
    const urg = deadlineUrgency(t.deadline);
    const flag = urg === "overdue" ? "\u26A0 VERLOPEN" : urg === "soon" ? "\u23F0 binnenkort" : "";
    const remaining = getTaskRemainingMinutes(t);
    const partial = t.sessions && t.sessions.length > 0;
    const timeLabel = partial
        ? `${remaining} min nog te plannen (van ${t.estimatedMinutes} min totaal)`
        : `${t.estimatedMinutes} min`;
    const subjectName = getSubjectName(t.subjectId);
    const isPauseTask = subjectName.trim().toLowerCase() === "pauze";
    const isOtherTask = subjectName.trim().toLowerCase() === "andere";
    const pauseIcon = isPauseTask ? "\u23F8\uFE0F " : "";
    const chipColor = getSubjectColor(t.subjectId);
    const titleLine = isOtherTask ? escapeHtml(t.title) : `${escapeHtml(subjectName)}: ${escapeHtml(t.title)}`;
    return `<div class="task-chip ${isPauseTask ? "is-pause-task" : ""} ${isOtherTask ? "is-other-task" : ""}" draggable="true" data-task-id="${t.id}" style="background:${chipColor}; color:${getContrastTextColor(chipColor)}">
      ${flag ? `<span class="deadline-flag">${flag}</span>` : ""}
      ${pauseIcon}${titleLine}
      <br><span style="opacity:.85">${timeLabel}${t.deadline ? ` \u00b7 deadline ${fmtDate(t.deadline)}` : ""}</span>
    </div>`;
}

function wireTaskChipsAndDropzones(container) {
    container.querySelectorAll(".task-chip").forEach(chip => {
        chip.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", JSON.stringify({ taskId: Number(chip.dataset.taskId), sessionId: null }));
            e.dataTransfer.effectAllowed = "move";
        });
        chip.addEventListener("contextmenu", (e) => { e.preventDefault(); openTaskEditModal(Number(chip.dataset.taskId)); });
    });
    container.querySelectorAll('[data-dropzone="matrix"]').forEach(zone => {
        zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("drag-over"); });
        zone.addEventListener("dragleave", () => zone.classList.remove("drag-over"));
        zone.addEventListener("drop", (e) => {
            e.preventDefault(); zone.classList.remove("drag-over");
            const payload = parseDragPayload(e);
            if (!payload) return;
            saveUndoSnapshot();
            if (payload.sessionId != null) {
                removeSession(payload.taskId, payload.sessionId);
                showToast("Sessie losgemaakt van kalender", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Hersteld"); } });
            } else {
                unplanTask(payload.taskId);
                showToast("Losgemaakt van kalender", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Hersteld"); } });
            }
            refreshAll();
        });
    });
}

function renderMatrix(container, openTasks) {
    container.innerHTML = `
      <div class="cal-nav" style="visibility:hidden;" aria-hidden="true">
        <button class="btn btn-sm">&larr; Vorige week</button>
        <button class="btn btn-sm">Vandaag</button>
      </div>
      <div class="matrix-grid">
      ${QUADRANTS.map(q => {
          const items = openTasks.filter(t => t.urgent === q.urgent && t.important === q.important);
          return `<div class="quadrant" data-quadrant="${q.key}">
            <div class="quadrant-header" style="background:${q.color}; color:${q.text}">${q.label}<span class="sub">${q.sub}</span></div>
            <div class="quadrant-body" data-dropzone="matrix">
              ${items.map(renderTaskChipHtml).join("")}
            </div>
          </div>`;
      }).join("")}
    </div>`;
    wireTaskChipsAndDropzones(container);
}

function renderTaskListView(container, openTasks) {
    // Eenvoudige lijstweergave zonder Eisenhower-matrix: alle taken gewoon
    // onder elkaar, gesorteerd op deadline (dringendste eerst, geen deadline
    // achteraan). Bedoeld als minder abstract alternatief, bv. voor BSO of de
    // eerste graad.
    const sorted = [...openTasks].sort((a, b) => {
        if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
        if (a.deadline) return -1;
        if (b.deadline) return 1;
        return 0;
    });
    container.innerHTML = `
      <div class="cal-nav" style="visibility:hidden;" aria-hidden="true">
        <button class="btn btn-sm">&larr; Vorige week</button>
        <button class="btn btn-sm">Vandaag</button>
      </div>
      <div class="task-list-view" data-dropzone="matrix">
        ${sorted.length ? sorted.map(renderTaskChipHtml).join("") : '<div class="empty-state">Geen openstaande taken.</div>'}
      </div>`;
    wireTaskChipsAndDropzones(container);
}

function parseDragPayload(e) {
    const raw = e.dataTransfer.getData("text/plain");
    if (!raw) return null;
    try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed.taskId === "number") return parsed;
    } catch (err) { /* niet-JSON payload, negeren */ }
    return null;
}

// ---------------------------------------------------------------------------
// Sleep-selectie van meerdere kalendervakken tegelijk (bv. voor "schooltijd"
// in één keer over meerdere uren en eventueel meerdere dagen blokkeren)
// ---------------------------------------------------------------------------
let blockSelection = null; // { dayIndex, startIdx, endIdx } tijdens het muis-slepen
let cellTouchStartPos = null; // { x, y } bij touchstart, om een tik van een veeg te onderscheiden
let tapSelection = null; // { dayIndex, startIdx } -- eerste tik op een touchscreen, wacht op de tweede
let touchLongPressTimer = null; // timer voor het "lang indrukken en dan slepen"-gebaar op touchscreens
let touchDragActive = false; // true zodra de lang-indruk geactiveerd is en er nu gesleept wordt

function beginBlockSelection(dayIndex, blockIdx) {
    blockSelection = { dayIndex, startIdx: blockIdx, endIdx: blockIdx };
    document.body.style.userSelect = "none";
    updateBlockSelectionHighlight();
    document.addEventListener("mouseup", endBlockSelection, { once: true });
}
function extendBlockSelection(dayIndex, blockIdx) {
    if (!blockSelection || dayIndex !== blockSelection.dayIndex) return;
    blockSelection.endIdx = blockIdx;
    updateBlockSelectionHighlight();
}
function updateBlockSelectionHighlight() {
    if (!blockSelection) return;
    const { dayIndex, startIdx, endIdx } = blockSelection;
    const lo = Math.min(startIdx, endIdx), hi = Math.max(startIdx, endIdx);
    document.querySelectorAll(".cal-cell").forEach(cell => {
        const d = Number(cell.dataset.day), idx = Number(cell.dataset.blockIdx);
        cell.classList.toggle("selecting", d === dayIndex && idx >= lo && idx <= hi);
    });
}
function endBlockSelection() {
    document.body.style.userSelect = "";
    if (!blockSelection) return;
    const { dayIndex, startIdx, endIdx } = blockSelection;
    const lo = Math.min(startIdx, endIdx), hi = Math.max(startIdx, endIdx);
    blockSelection = null;
    document.querySelectorAll(".cal-cell.selecting").forEach(c => c.classList.remove("selecting"));
    const blockStarts = TIME_BLOCKS.slice(lo, hi + 1).map(b => b.start);
    openMultiBlockModal(dayIndex, blockStarts);
}

function handleCellTap(dayIndex, blockIdx, cellEl) {
    // Twee-tikken-systeem voor touchscreens (i.p.v. slepen, dat botst met het
    // native scrollen van de kalender): eerste tik markeert het beginuur en
    // wacht af, tweede tik (zelfde dag) rondt de selectie af en opent het
    // venster -- tik tweemaal dezelfde cel voor exact \u00e9\u00e9n uur.
    if (!tapSelection || tapSelection.dayIndex !== dayIndex) {
        tapSelection = { dayIndex, startIdx: blockIdx };
        document.querySelectorAll(".cal-cell.tap-pending").forEach(c => c.classList.remove("tap-pending"));
        cellEl.classList.add("tap-pending");
        showToast("Tik op het laatste uur om te blokkeren (of nogmaals hier voor \u00e9\u00e9n uur)");
        return;
    }
    const lo = Math.min(tapSelection.startIdx, blockIdx), hi = Math.max(tapSelection.startIdx, blockIdx);
    document.querySelectorAll(".cal-cell.tap-pending").forEach(c => c.classList.remove("tap-pending"));
    tapSelection = null;
    const blockStarts = TIME_BLOCKS.slice(lo, hi + 1).map(b => b.start);
    openMultiBlockModal(dayIndex, blockStarts);
}

function openMultiBlockModal(dayIndex, blockStarts) {
    const dayDate = addDays(planningMonday, dayIndex);
    const startLabel = TIME_BLOCKS.find(b => b.start === blockStarts[0]).label.split("-")[0];
    const endLabel = TIME_BLOCKS.find(b => b.start === blockStarts[blockStarts.length - 1]).label.split("-")[1];
    const anyBlocked = blockStarts.some(bs => getBlockedSlotForDay(dayDate, dayIndex, bs));
    openModal(`
      <h2>Tijdslots blokkeren</h2>
      <p class="hint">${DAY_NAMES[dayIndex]} ${dayDate.slice(8, 10)}/${dayDate.slice(5, 7)}, van ${startLabel}u tot ${endLabel} (${blockStarts.length} uur)</p>
      <div class="field">
        <label class="checkbox-row"><input type="radio" name="mbMode" value="once"> Enkel deze week (eenmalig)</label><br>
        <label class="checkbox-row"><input type="radio" name="mbMode" value="weekly" checked> Elke week (wekelijks terugkerend)</label>
      </div>
      <div class="field"><label class="field-label">Naam</label><input type="text" id="mbLabel" placeholder="bv. School, Pauze, Andere, Sporttraining"></div>
      <div class="field">
        <label class="field-label">Ook toepassen op dezelfde uren op</label>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
          ${DAY_NAMES.map((d, i) => `<label class="checkbox-row"><input type="checkbox" class="mbDayCheck" value="${i}" ${i === dayIndex ? "checked" : ""}> ${d}</label>`).join("")}
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="mbSaveBtn">Blokkeren</button>
        <button class="btn" data-close>Annuleren</button>
      </div>
      ${anyBlocked ? `
      <div class="field" style="border-top:1px solid var(--border); padding-top:12px; margin-top:14px;">
        <label class="field-label">Of verwijder deze ${blockStarts.length} uur meteen (op de hierboven aangevinkte dagen)</label>
        <div class="modal-actions" style="margin-top:6px;">
          <button class="btn btn-danger btn-sm" id="mbRemoveWeekBtn">Verwijder enkel deze week</button>
          <button class="btn btn-danger btn-sm" id="mbRemoveAllBtn">Verwijder voor alle weken</button>
        </div>
      </div>` : ""}
    `, { onMount: (modal) => {
        modal.querySelector("#mbLabel").focus();
        modal.querySelector("[data-close]").addEventListener("click", closeModal);
        modal.querySelector("#mbSaveBtn").addEventListener("click", () => {
            const label = modal.querySelector("#mbLabel").value.trim();
            if (!label) { alert("Geef het blok een naam."); return; }
            const mode = modal.querySelector('input[name="mbMode"]:checked').value;
            const checkedDays = Array.from(modal.querySelectorAll(".mbDayCheck:checked")).map(cb => Number(cb.value));
            if (!checkedDays.length) { alert("Kies minstens één dag."); return; }
            checkedDays.forEach(di => {
                const targetDate = addDays(planningMonday, di);
                blockStarts.forEach(bs => {
                    if (mode === "once") addOnetimeBlock(targetDate, bs, label);
                    else { addRecurringBlock(di, bs, label); clearBlockException(di, bs); }
                });
            });
            closeModal(); refreshAll();
            showToast(`${checkedDays.length * blockStarts.length} tijdslot(en) geblokkeerd`);
        });
        const removeRange = (removeMode) => {
            const checkedDays = Array.from(modal.querySelectorAll(".mbDayCheck:checked")).map(cb => Number(cb.value));
            if (!checkedDays.length) { alert("Kies minstens één dag."); return; }
            saveUndoSnapshot();
            let total = 0;
            checkedDays.forEach(di => {
                const targetDate = addDays(planningMonday, di);
                total += removeBlockedRange(di, targetDate, blockStarts, removeMode);
            });
            closeModal(); refreshAll();
            showToast(`${total} tijdslot(en) verwijderd`, { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Hersteld"); } });
        };
        const removeWeekBtn = modal.querySelector("#mbRemoveWeekBtn");
        if (removeWeekBtn) removeWeekBtn.addEventListener("click", () => removeRange("week"));
        const removeAllBtn = modal.querySelector("#mbRemoveAllBtn");
        if (removeAllBtn) removeAllBtn.addEventListener("click", () => removeRange("all"));
    }});
}

function openMinutesPickerModal(taskId, date, time) {
    const t = getTask(taskId);
    if (!t) return;
    const remaining = getTaskRemainingMinutes(t);
    const dayLabel = `${DAY_NAMES[weekdayIndex(date)]} ${date.slice(8, 10)}/${date.slice(5, 7)}`;
    openModal(`
      <h2>Inplannen</h2>
      <p class="hint">${escapeHtml(t.title)} \u2014 ${dayLabel} om ${time}</p>
      <div class="field">
        <label class="field-label">Hoeveel minuten nu inplannen?</label>
        <input type="number" id="mpMinutes" value="${Math.min(remaining, 60)}" min="1" max="${remaining}" step="5">
        <p class="hint" style="margin-top:6px;">Resterend van deze taak: ${remaining} min. Vul minder in om de rest straks apart in te plannen \u2014 zo splits je een taak eenvoudig op.</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="mpConfirmBtn">Inplannen</button>
        <button class="btn" data-close>Annuleren</button>
      </div>
    `, { onMount: (modal) => {
        const input = modal.querySelector("#mpMinutes");
        input.focus(); input.select();
        modal.querySelector("[data-close]").addEventListener("click", closeModal);
        modal.querySelector("#mpConfirmBtn").addEventListener("click", () => {
            let minutes = Number(input.value);
            if (!minutes || minutes <= 0) { alert("Geef een geldig aantal minuten (groter dan 0)."); return; }
            if (minutes > remaining) minutes = remaining;
            if (t.deadline && date > t.deadline) {
                const ok = confirm(`Let op: ${dayLabel} ligt N\u00c1 de deadline van deze taak (${fmtDate(t.deadline)}). Toch inplannen?`);
                if (!ok) return;
            }
            planTask(taskId, date, time, minutes);
            closeModal(); refreshAll();
            showToast(minutes < remaining ? `${minutes} min ingepland \u2014 ${remaining - minutes} min resterend` : "Ingepland");
        });
        input.addEventListener("keydown", e => { if (e.key === "Enter") modal.querySelector("#mpConfirmBtn").click(); });
    }});
}

function renderCalendar(container, blockedMap, plannedRows, todayIso) {
    const bySlot = {};
    plannedRows.forEach(t => { const key = `${t.date}|${t.time}`; (bySlot[key] = bySlot[key] || []).push(t); });
    const sunday = addDays(planningMonday, 6);
    const dayIsos = []; for (let i = 0; i < 7; i++) dayIsos.push(addDays(planningMonday, i));

    let gridHtml = `<div class="cal-head-cell time-col-head"></div>`;
    dayIsos.forEach((d, i) => {
        const isToday = d === todayIso;
        gridHtml += `<div class="cal-head-cell ${isToday ? "today" : ""}">${DAY_NAMES[i]}<br>${d.slice(8, 10)}/${d.slice(5, 7)}${isToday ? " (vandaag)" : ""}</div>`;
    });
    TIME_BLOCKS.forEach((b, blockIdx) => {
        gridHtml += `<div class="cal-time-label">${b.label}</div>`;
        dayIsos.forEach((d, dayIdx) => {
            const blocked = blockedMap[`${dayIdx}|${b.start}`];
            const sessionsHere = bySlot[`${d}|${b.start}`] || [];
            let inner = "";
            if (blocked) {
                const labelLower = blocked.label.trim().toLowerCase();
                const isSchool = labelLower === "school";
                const isPause = labelLower === "pauze";
                const isOther = labelLower === "andere";
                const themeIcon = isPause ? "\u23F8\uFE0F " : isSchool ? "\u{1F3EB} " : "";
                const recurIcon = isSchool ? "" : (blocked.isOnetime ? "\u{1F4CC} " : "\u{1F512} ");
                inner += `<div class="cal-block-card ${isSchool ? "is-school" : ""} ${isPause ? "is-pause" : ""} ${isOther ? "is-other" : ""}" data-block-day="${dayIdx}" data-block-date="${d}" data-block-start="${b.start}" data-block-onetime="${blocked.isOnetime}">
                  ${themeIcon}${recurIcon}${escapeHtml(blocked.label)}${blocked.duration && blocked.duration < 60 ? ` (${blocked.duration}m)` : ""}
                </div>`;
            }
            sessionsHere.forEach(t => {
                const done = !!t.sessionDone;
                const subjectName = getSubjectName(t.subjectId);
                const isPauseTask = subjectName.trim().toLowerCase() === "pauze";
                const isOtherTask = subjectName.trim().toLowerCase() === "andere";
                const color = getSubjectColor(t.subjectId);
                const partLabel = t.sessionCount > 1 ? " \u00b7 deel" : "";
                const urg = done ? null : deadlineUrgency(t.deadline);
                const urgClass = urg === "overdue" ? "overdue" : urg === "soon" ? "soon" : "";
                const urgFlag = urg === "overdue" ? "\u26A0 VERLOPEN" : urg === "soon" ? "\u23F0 binnenkort" : "";
                const pauseIcon = isPauseTask ? "\u23F8\uFE0F " : "";
                const cardTitleLine = isOtherTask ? escapeHtml(t.title) : `${escapeHtml(subjectName)}: ${escapeHtml(t.title)}`;
                inner += `<div class="cal-task-card ${done ? "done" : ""} ${urgClass} ${isPauseTask ? "is-pause-task" : ""} ${isOtherTask ? "is-other-task" : ""}" draggable="true" data-task-id="${t.taskId}" data-session-id="${t.sessionId}" style="background:${color}; color:${getContrastTextColor(color)}">
                  ${done ? '<span class="done-badge">\u2713</span>' : ""}${urgFlag ? `<span class="deadline-flag">${urgFlag}</span>` : ""}${pauseIcon}${cardTitleLine}${partLabel} (${t.minutes}m)
                </div>`;
            });
            gridHtml += `<div class="cal-cell" data-day="${dayIdx}" data-date="${d}" data-block-start="${b.start}" data-block-idx="${blockIdx}">${inner}</div>`;
        });
    });

    container.innerHTML = `
      <div class="cal-nav">
        <button class="btn btn-sm" id="prevWeekBtn">&larr; Vorige week</button>
        <button class="btn btn-sm" id="todayWeekBtn">Vandaag</button>
        <button class="btn btn-sm" id="nextWeekBtn">Volgende week &rarr;</button>
        <span class="cal-range">${fmtDate(planningMonday)} \u2013 ${fmtDate(sunday)}</span>
      </div>
      <p class="cal-scroll-hint">\u2194\uFE0F Veeg opzij om de andere dagen van de week te zien</p>
      <div class="cal-scroll"><div class="cal-grid">${gridHtml}</div></div>
    `;
    container.querySelector("#prevWeekBtn").addEventListener("click", () => { planningMonday = addDays(planningMonday, -7); renderPlanningTab(); });
    container.querySelector("#nextWeekBtn").addEventListener("click", () => { planningMonday = addDays(planningMonday, 7); renderPlanningTab(); });
    container.querySelector("#todayWeekBtn").addEventListener("click", () => { planningMonday = weekStart(isoFromDate(new Date())); renderPlanningTab(); });

    container.querySelectorAll(".cal-cell").forEach(cell => {
        cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("drag-over"); });
        cell.addEventListener("dragleave", () => cell.classList.remove("drag-over"));
        cell.addEventListener("drop", (e) => {
            e.preventDefault(); cell.classList.remove("drag-over");
            const payload = parseDragPayload(e);
            if (!payload) return;
            const dayIdx = Number(cell.dataset.day), d = cell.dataset.date, bs = cell.dataset.blockStart;
            const blocked = getBlockedSlotForDay(d, dayIdx, bs);
            if (blocked) { alert(`Dit moment is geblokkeerd voor '${blocked.label}'. Kies een ander tijdstip.`); return; }
            if (payload.sessionId != null) {
                // een bestaande sessie naar een andere cel slepen = VERPLAATSEN (duur blijft gelijk)
                const movedTask = getTask(payload.taskId);
                const movedSession = movedTask && (movedTask.sessions || []).find(s => s.id === payload.sessionId);
                const dateChanges = movedSession && movedSession.date !== d;
                if (movedTask && movedTask.deadline && dateChanges && d > movedTask.deadline) {
                    const ok = confirm(`Let op: dit tijdstip ligt N\u00c1 de deadline van '${movedTask.title}' (${fmtDate(movedTask.deadline)}). Toch verplaatsen?`);
                    if (!ok) { showToast("Niet verplaatst \u2014 de deadline was al voorbij"); return; }
                }
                updateSession(payload.taskId, payload.sessionId, { date: d, time: bs });
                showToast("Sessie verplaatst");
                refreshAll();
            } else {
                // vanuit de matrix = (een deel van) de resterende tijd hier NIEUW inplannen
                openMinutesPickerModal(payload.taskId, d, bs);
            }
        });
        cell.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            const dayIdx = Number(cell.dataset.day), d = cell.dataset.date, bs = cell.dataset.blockStart;
            openBlockModal(dayIdx, d, bs);
        });
        // sleep-selectie over meerdere uren tegelijk (voor snel bv. "schooltijd"
        // blokkeren). Met de muis: gewoon inklikken en slepen. Op een
        // touchscreen zou een gewone veeg botsen met het native scrollen van
        // de kalender, dus daar moet je eerst even LANG INDRUKKEN om de
        // sleep-selectie te activeren (zie touchstart hieronder) -- een gewone
        // korte veeg blijft daardoor gewoon scrollen. Daarnaast blijft ook het
        // twee-tikken-systeem beschikbaar als alternatief (zie handleCellTap).
        cell.addEventListener("mousedown", (e) => {
            if (e.target !== cell || e.button !== 0) return; // enkel op de lege celachtergrond, linkerknop
            e.preventDefault();
            beginBlockSelection(Number(cell.dataset.day), Number(cell.dataset.blockIdx));
        });
        cell.addEventListener("mouseenter", () => {
            extendBlockSelection(Number(cell.dataset.day), Number(cell.dataset.blockIdx));
        });
        cell.addEventListener("touchstart", (e) => {
            if (e.target !== cell) return;
            const t = e.touches[0];
            cellTouchStartPos = { x: t.clientX, y: t.clientY };
            touchDragActive = false;
            clearTimeout(touchLongPressTimer);
            // Lang indrukken (zonder te bewegen) start een LIVE sleep-selectie,
            // net als op een computer met de muis -- een bekend gebaar op
            // touchscreens (bv. bestanden selecteren). Een gewone, snelle veeg
            // blijft daardoor gewoon scrollen zoals verwacht.
            touchLongPressTimer = setTimeout(() => {
                touchDragActive = true;
                if (navigator.vibrate) navigator.vibrate(30);
                beginBlockSelection(Number(cell.dataset.day), Number(cell.dataset.blockIdx));
            }, 450);
        }, { passive: true });
        cell.addEventListener("touchmove", (e) => {
            if (!cellTouchStartPos) return;
            const t = e.touches[0];
            if (!touchDragActive) {
                const dx = Math.abs(t.clientX - cellTouchStartPos.x), dy = Math.abs(t.clientY - cellTouchStartPos.y);
                if (dx > 10 || dy > 10) clearTimeout(touchLongPressTimer); // dit is een gewone veeg (scrollen) -- lang-indruk annuleren, scroll niet blokkeren
                return;
            }
            // De lang-indruk is al geactiveerd: nu actief aan het slepen om te
            // selecteren, dus scroll blokkeren en de cel onder de vinger
            // opzoeken (touch-events blijven anders gebonden aan de cel waar
            // de aanraking begon, i.t.t. muis-events).
            e.preventDefault();
            if (typeof document.elementFromPoint !== "function") return; // veiligheidsnet voor uitzonderlijke browsers
            const el = document.elementFromPoint(t.clientX, t.clientY);
            const targetCell = el ? el.closest(".cal-cell") : null;
            if (targetCell) extendBlockSelection(Number(targetCell.dataset.day), Number(targetCell.dataset.blockIdx));
        }, { passive: false });
        cell.addEventListener("touchend", (e) => {
            clearTimeout(touchLongPressTimer);
            if (touchDragActive) {
                touchDragActive = false;
                cellTouchStartPos = null;
                e.preventDefault();
                endBlockSelection();
                return;
            }
            if (e.target !== cell || !cellTouchStartPos) return;
            const t = e.changedTouches[0];
            const dx = Math.abs(t.clientX - cellTouchStartPos.x), dy = Math.abs(t.clientY - cellTouchStartPos.y);
            cellTouchStartPos = null;
            if (dx > 12 || dy > 12) return; // dit was een veeg (scrollen), geen tik -- negeren, scroll niet blokkeren
            // Dit was een echte tik: voorkom dat de browser hierna ook nog eens
            // nagemaakte muis-events (mousedown/mouseup/click) afvuurt voor
            // dezelfde aanraking -- anders triggert dat ALSNOG het muis-sleepsysteem
            // hierboven en opent er meteen een venster voor maar 1 uur.
            e.preventDefault();
            handleCellTap(Number(cell.dataset.day), Number(cell.dataset.blockIdx), cell);
        }, { passive: false });
    });
    container.querySelectorAll(".cal-task-card").forEach(card => {
        card.addEventListener("dragstart", (e) => {
            e.stopPropagation();
            e.dataTransfer.setData("text/plain", JSON.stringify({
                taskId: Number(card.dataset.taskId), sessionId: Number(card.dataset.sessionId),
            }));
            e.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dblclick", (e) => { e.stopPropagation(); toggleSessionDone(Number(card.dataset.taskId), Number(card.dataset.sessionId)); refreshAll(); });
        card.addEventListener("contextmenu", (e) => { e.preventDefault(); e.stopPropagation(); openTaskEditModal(Number(card.dataset.taskId)); });
        // Slepen om de volgorde binnen hetzelfde uur te wijzigen (of, bij een
        // sleep vanuit een ander uur, meteen op de juiste plek in te voegen).
        card.addEventListener("dragover", (e) => {
            e.preventDefault();
            const rect = card.getBoundingClientRect();
            const before = (e.clientY - rect.top) < rect.height / 2;
            card.classList.toggle("drag-insert-before", before);
            card.classList.toggle("drag-insert-after", !before);
        });
        card.addEventListener("dragleave", () => {
            card.classList.remove("drag-insert-before", "drag-insert-after");
        });
        card.addEventListener("drop", (e) => {
            card.classList.remove("drag-insert-before", "drag-insert-after");
            const payload = parseDragPayload(e);
            if (!payload || payload.sessionId == null) return; // een NIEUWE sessie vanuit de matrix: laat de cel dit gewoon afhandelen
            e.preventDefault();
            e.stopPropagation();
            const cell = card.closest(".cal-cell");
            const dayIdx = Number(cell.dataset.day), d = cell.dataset.date, bs = cell.dataset.blockStart;
            const blocked = getBlockedSlotForDay(d, dayIdx, bs);
            if (blocked) { alert(`Dit moment is geblokkeerd voor '${blocked.label}'. Kies een ander tijdstip.`); return; }

            const movedTask2 = getTask(payload.taskId);
            const movedSession2 = movedTask2 && (movedTask2.sessions || []).find(s => s.id === payload.sessionId);
            const dateChanges2 = movedSession2 && movedSession2.date !== d;
            if (movedTask2 && movedTask2.deadline && dateChanges2 && d > movedTask2.deadline) {
                const ok = confirm(`Let op: dit tijdstip ligt N\u00c1 de deadline van '${movedTask2.title}' (${fmtDate(movedTask2.deadline)}). Toch verplaatsen?`);
                if (!ok) { showToast("Niet verplaatst \u2014 de deadline was al voorbij"); return; }
            }
            updateSession(payload.taskId, payload.sessionId, { date: d, time: bs });

            const rect = card.getBoundingClientRect();
            const before = (e.clientY - rect.top) < rect.height / 2;
            const existingRefs = Array.from(cell.querySelectorAll(".cal-task-card"))
                .map(c => ({ taskId: Number(c.dataset.taskId), sessionId: Number(c.dataset.sessionId) }))
                .filter(r => !(r.taskId === payload.taskId && r.sessionId === payload.sessionId));
            const targetIndex = existingRefs.findIndex(r => r.taskId === Number(card.dataset.taskId) && r.sessionId === Number(card.dataset.sessionId));
            existingRefs.splice(before ? targetIndex : targetIndex + 1, 0, { taskId: payload.taskId, sessionId: payload.sessionId });
            reorderSessionsInSlot(d, bs, existingRefs);
            refreshAll();
            showToast("Volgorde aangepast");
        });
    });
    container.querySelectorAll(".cal-block-card").forEach(card => {
        card.addEventListener("dblclick", (e) => {
            e.stopPropagation();
            const dayIdx = Number(card.dataset.blockDay), d = card.dataset.blockDate, bs = card.dataset.blockStart;
            saveUndoSnapshot();
            if (card.dataset.blockOnetime === "true") {
                removeOnetimeBlock(d, bs);
                refreshAll();
                showToast("Blok verwijderd", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Blok hersteld"); } });
            } else {
                // Veilige standaardactie: enkel deze week, niet de hele wekelijkse
                // herhaling. Voor "alle weken verwijderen" -> rechtsklik -> venster.
                skipRecurringBlockForDate(dayIdx, bs, d);
                refreshAll();
                showToast("Blok verwijderd voor deze week (blijft op andere weken staan)", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Blok hersteld"); } });
            }
        });
        card.addEventListener("contextmenu", (e) => {
            e.preventDefault(); e.stopPropagation();
            const dayIdx = Number(card.dataset.blockDay), d = card.dataset.blockDate, bs = card.dataset.blockStart;
            openBlockModal(dayIdx, d, bs);
        });
    });
}

function openTaskEditModal(taskId, onSaved) {
    const t = getTask(taskId);
    if (!t) return;
    openModal(`
      <h2>Taak bewerken \u2014 ${escapeHtml(getSubjectName(t.subjectId))}</h2>
      <div class="field"><label class="field-label">Titel</label><input type="text" id="editTitle" value="${escapeHtml(t.title)}"></div>
      <div class="field"><label class="field-label">Omschrijving</label><textarea id="editDesc">${escapeHtml(t.description || "")}</textarea></div>
      <div class="field-row">
        <div class="field"><label class="field-label">Deadline</label><input type="date" id="editDeadline" value="${t.deadline || ""}"></div>
        <div class="field"><label class="field-label">Geschatte tijd (min)</label><input type="number" id="editMinutes" value="${t.estimatedMinutes}" min="5" step="5"></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">Werkelijke tijd (min)</label><input type="number" id="editActual" value="${t.actualMinutes || 0}" min="0" step="5"></div>
        <div class="field" style="display:flex; align-items:flex-end;"><button class="btn" id="startTimerBtn" style="width:100%;">\u23F1 Start timer</button></div>
      </div>
      <div class="field">
        <label class="field-label">Sessies (opgesplitst inplannen mogelijk)</label>
        <div id="sessionsListWrap"></div>
        <button class="btn btn-sm" id="addSessionRowBtn" type="button">+ Sessie toevoegen</button>
        <p class="hint" id="sessionsTotalHint" style="margin-top:6px;"></p>
      </div>
      <div class="field-row">
        <label class="checkbox-row"><input type="checkbox" id="editUrgent" ${t.urgent ? "checked" : ""}> Urgent</label>
        <label class="checkbox-row"><input type="checkbox" id="editImportant" ${t.important ? "checked" : ""}> Belangrijk</label>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="editStudy" ${t.isStudy ? "checked" : ""}> Leerstof (te herhalen)</label>
      <div class="hint" style="margin-top:8px;">Status: ${t.status}${t.completedAt ? " &middot; afgewerkt op " + fmtDate(t.completedAt) : ""}</div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveTaskBtn">Opslaan</button>
        <button class="btn btn-danger" id="deleteTaskBtn">Verwijderen</button>
        <button class="btn" data-close>Annuleren</button>
      </div>
    `, { onMount: (modal) => {
        modal.querySelector("[data-close]").addEventListener("click", closeModal);
        modal.querySelector("#startTimerBtn").addEventListener("click", () => {
            openTimerModal(t, () => { const fresh = getTask(taskId); if (fresh) modal.querySelector("#editActual").value = fresh.actualMinutes || 0; });
        });

        // ---- sessies-lijst (lokale werkkopie, pas definitief bij Opslaan) ----
        const workingSessions = (t.sessions || []).map(s => ({ ...s }));
        function updateTotalHint() {
            const total = workingSessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
            const est = Number(modal.querySelector("#editMinutes").value) || t.estimatedMinutes;
            const hint = modal.querySelector("#sessionsTotalHint");
            if (total < est) hint.textContent = `Totaal ingepland: ${total} / ${est} min (nog ${est - total} min te plannen)`;
            else if (total > est) hint.textContent = `Totaal ingepland: ${total} / ${est} min (meer dan de geschatte tijd \u2014 dat mag)`;
            else hint.textContent = `Totaal ingepland: ${total} / ${est} min \u2713`;
        }
        function renderSessionRows() {
            const wrap = modal.querySelector("#sessionsListWrap");
            wrap.innerHTML = workingSessions.length ? workingSessions.map((s, i) => `
              <div class="field-row" style="align-items:center; margin-bottom:6px; gap:6px;" data-session-row="${i}">
                <input type="date" class="sessDate" value="${s.date || ""}" style="flex:1.3;">
                <input type="time" class="sessTime" value="${s.time || ""}" style="flex:1;">
                <input type="number" class="sessMinutes" value="${s.minutes}" min="1" step="5" style="flex:0.8;" title="minuten">
                <button class="btn btn-sm btn-danger" type="button" data-remove-session="${i}" title="Sessie verwijderen">\u{1F5D1}</button>
              </div>
            `).join("") : '<p class="hint">Nog geen sessies \u2014 voeg er een toe om deze taak in te plannen.</p>';
            wrap.querySelectorAll("[data-session-row]").forEach(row => {
                const i = Number(row.dataset.sessionRow);
                row.querySelector(".sessDate").addEventListener("input", e => { workingSessions[i].date = e.target.value; });
                row.querySelector(".sessTime").addEventListener("input", e => { workingSessions[i].time = e.target.value; });
                row.querySelector(".sessMinutes").addEventListener("input", e => { workingSessions[i].minutes = Number(e.target.value) || 0; updateTotalHint(); });
            });
            wrap.querySelectorAll("[data-remove-session]").forEach(btn => {
                btn.addEventListener("click", () => {
                    workingSessions.splice(Number(btn.dataset.removeSession), 1);
                    renderSessionRows(); updateTotalHint();
                });
            });
            updateTotalHint();
        }
        modal.querySelector("#addSessionRowBtn").addEventListener("click", () => {
            const usedSoFar = workingSessions.reduce((sum, s) => sum + (Number(s.minutes) || 0), 0);
            const est = Number(modal.querySelector("#editMinutes").value) || t.estimatedMinutes;
            workingSessions.push({ date: "", time: "", minutes: Math.max(1, est - usedSoFar) });
            renderSessionRows();
        });
        modal.querySelector("#editMinutes").addEventListener("input", updateTotalHint);
        renderSessionRows();

        modal.querySelector("#saveTaskBtn").addEventListener("click", () => {
            const title = modal.querySelector("#editTitle").value.trim();
            if (!title) { alert("Geef de taak een titel."); return; }
            const validSessions = workingSessions.filter(s => s.date && s.time);
            for (const s of validSessions) {
                const blocked = getBlockedSlotForDay(s.date, weekdayIndex(s.date), s.time);
                if (blocked) {
                    alert(`Sessie op ${fmtDate(s.date)} om ${s.time} valt op een geblokkeerd moment ('${blocked.label}'). Pas dat eerst aan.`);
                    return;
                }
            }
            const newDeadline = modal.querySelector("#editDeadline").value || null;
            if (newDeadline) {
                const lateSessions = validSessions.filter(s => s.date > newDeadline);
                if (lateSessions.length) {
                    const ok = confirm(`Let op: ${lateSessions.length} sessie(s) staan gepland N\u00c1 de deadline (${fmtDate(newDeadline)}). Toch opslaan?`);
                    if (!ok) return;
                }
            }
            updateTask(taskId, {
                title, description: modal.querySelector("#editDesc").value,
                deadline: newDeadline,
                estimatedMinutes: Number(modal.querySelector("#editMinutes").value) || 30,
                actualMinutes: Number(modal.querySelector("#editActual").value) || 0,
                urgent: modal.querySelector("#editUrgent").checked,
                important: modal.querySelector("#editImportant").checked,
                isStudy: modal.querySelector("#editStudy").checked,
            });
            setTaskSessions(taskId, validSessions);
            closeModal(); refreshAll(); showToast("Taak opgeslagen");
            if (onSaved) onSaved();
        });
        modal.querySelector("#deleteTaskBtn").addEventListener("click", () => {
            saveUndoSnapshot();
            deleteTask(taskId); closeModal(); refreshAll();
            showToast("Taak verwijderd", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Taak hersteld"); } });
            if (onSaved) onSaved();
        });
    }});
}

function openBlockModal(dayIndex, dayIso, blockStart) {
    const existing = getBlockedSlotForDay(dayIso, dayIndex, blockStart);
    const dayLabel = `${DAY_NAMES[dayIndex]} ${dayIso.slice(8, 10)}/${dayIso.slice(5, 7)}`;
    openModal(`
      <h2>Tijdslot blokkeren</h2>
      <p class="hint">${dayLabel} om ${blockStart}</p>
      <div class="field">
        <label class="checkbox-row"><input type="radio" name="blockMode" value="once" ${existing && existing.isOnetime ? "checked" : ""}> Enkel deze week (eenmalig)</label><br>
        <label class="checkbox-row"><input type="radio" name="blockMode" value="weekly" ${!existing || !existing.isOnetime ? "checked" : ""}> Elke week (wekelijks terugkerend)</label>
      </div>
      <div class="field"><label class="field-label">Naam</label><input type="text" id="blockLabel" value="${existing ? escapeHtml(existing.label) : ""}" placeholder="bv. School, Pauze, Andere, Sporttraining"></div>
      <div class="field">
        <label class="field-label">Duur (minuten)</label>
        <input type="number" id="blockDuration" min="5" max="60" step="5" value="${existing ? existing.duration : 60}">
        <p class="hint" style="margin-top:4px;">Het uurvak zelf staat wel volledig als bezet in de kalender \u2014 dit getal is enkel om de echte duur te noteren (bv. een pauze van 15 min binnen dit uur).</p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveBlockBtn">Opslaan</button>
        ${existing && existing.isOnetime ? '<button class="btn btn-danger" id="removeBlockBtn">Verwijder blok</button>' : ""}
        ${existing && !existing.isOnetime ? '<button class="btn btn-danger" id="removeWeekBtn">Verwijder enkel deze week</button>' : ""}
        ${existing && !existing.isOnetime ? '<button class="btn btn-danger" id="removeAllBtn">Verwijder voor alle weken</button>' : ""}
        <button class="btn" data-close>Annuleren</button>
      </div>
    `, { onMount: (modal) => {
        modal.querySelector("[data-close]").addEventListener("click", closeModal);
        modal.querySelector("#saveBlockBtn").addEventListener("click", () => {
            const label = modal.querySelector("#blockLabel").value.trim();
            if (!label) { alert("Geef het blok een naam."); return; }
            const duration = Math.min(60, Math.max(5, Number(modal.querySelector("#blockDuration").value) || 60));
            const mode = modal.querySelector('input[name="blockMode"]:checked').value;
            if (mode === "once") addOnetimeBlock(dayIso, blockStart, label, duration);
            else { addRecurringBlock(dayIndex, blockStart, label, duration); clearBlockException(dayIndex, blockStart); }
            closeModal(); refreshAll(); showToast("Blok opgeslagen");
        });
        const removeBtn = modal.querySelector("#removeBlockBtn");
        if (removeBtn) {
            removeBtn.addEventListener("click", () => {
                saveUndoSnapshot();
                removeOnetimeBlock(dayIso, blockStart);
                closeModal(); refreshAll();
                showToast("Blok verwijderd", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Blok hersteld"); } });
            });
        }
        const removeWeekBtn = modal.querySelector("#removeWeekBtn");
        if (removeWeekBtn) {
            removeWeekBtn.addEventListener("click", () => {
                saveUndoSnapshot();
                skipRecurringBlockForDate(dayIndex, blockStart, dayIso);
                closeModal(); refreshAll();
                showToast("Blok verwijderd voor deze week (blijft op andere weken staan)", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Blok hersteld"); } });
            });
        }
        const removeAllBtn = modal.querySelector("#removeAllBtn");
        if (removeAllBtn) {
            removeAllBtn.addEventListener("click", () => {
                if (confirm(`'${existing.label}' verwijderen voor ALLE weken (de hele wekelijkse herhaling)?`)) {
                    saveUndoSnapshot();
                    removeRecurringBlock(dayIndex, blockStart);
                    closeModal(); refreshAll();
                    showToast("Blok verwijderd voor alle weken", { actionLabel: "Ongedaan maken", onAction: () => { undoLastAction(); refreshAll(); showToast("Blok hersteld"); } });
                }
            });
        }
    }});
}

let activeTimerInterval = null;
function openTimerModal(task, onLog) {
    let mode = "work", running = false, workMin = 25, breakMin = 5, remaining = 25 * 60, sessionSeconds = 0;
    let periodFresh = true; // true zolang deze periode nog niet gestart is (mag de duur dan nog aanpassen)
    openModal(`
      <h2>Studietimer</h2>
      <p style="text-align:center; font-weight:600;">${escapeHtml(task.title)}</p>
      <div class="timer-settings">
        <span>Werk (min): <input type="number" id="timerWork" value="25" min="5" max="90" step="5"></span>
        <span>Pauze (min): <input type="number" id="timerBreak" value="5" min="1" max="30"></span>
      </div>
      <div class="timer-mode" id="timerModeLabel">Werksessie</div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="timerStartBtn">Start</button>
        <button class="btn" id="timerResetBtn">Reset</button>
      </div>
      <div class="modal-actions"><button class="btn" id="timerCloseBtn">Stop &amp; sluiten (tijd opslaan)</button></div>
    `, {
        onMount: (modal) => {
            const display = modal.querySelector("#timerDisplay");
            const modeLabel = modal.querySelector("#timerModeLabel");
            const startBtn = modal.querySelector("#timerStartBtn");
            const workInput = modal.querySelector("#timerWork");
            const breakInput = modal.querySelector("#timerBreak");
            const fmt = (s) => { const m = Math.floor(Math.max(0, s) / 60), sec = Math.max(0, s) % 60; return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`; };
            const updateDisplay = () => { display.textContent = fmt(remaining); };
            // zolang de periode nog 'vers' is (nog niet gestart), houdt de klok de
            // ingevulde duur live bij, zodat je Start kan klikken zonder eerst Reset te doen
            const syncFreshDuration = () => {
                if (!periodFresh || running) return;
                if (mode === "work") { workMin = Number(workInput.value) || 25; remaining = workMin * 60; }
                else { breakMin = Number(breakInput.value) || 5; remaining = breakMin * 60; }
                updateDisplay();
            };
            workInput.addEventListener("input", syncFreshDuration);
            breakInput.addEventListener("input", syncFreshDuration);

            function onPeriodEnd() {
                running = false; startBtn.textContent = "Start";
                clearInterval(activeTimerInterval); activeTimerInterval = null;
                workInput.disabled = false; breakInput.disabled = false;
                if (mode === "work") {
                    addActualMinutes(task.id, workMin);
                    sessionSeconds = 0;
                    if (onLog) onLog();
                    alert(`Goed bezig! Tijd voor een pauze van ${breakMin} minuten.`);
                    mode = "break"; remaining = breakMin * 60; modeLabel.textContent = "Pauze";
                } else {
                    alert("Pauze voorbij, klaar voor de volgende werksessie?");
                    mode = "work"; remaining = workMin * 60; modeLabel.textContent = "Werksessie";
                }
                periodFresh = true;
                updateDisplay();
            }
            function tick() {
                periodFresh = false;
                remaining -= 1;
                if (mode === "work") sessionSeconds += 1;
                updateDisplay();
                if (remaining <= 0) onPeriodEnd();
            }
            startBtn.addEventListener("click", () => {
                running = !running;
                if (running) {
                    if (periodFresh) {
                        workMin = Number(workInput.value) || 25; breakMin = Number(breakInput.value) || 5;
                        remaining = (mode === "work" ? workMin : breakMin) * 60;
                        updateDisplay();
                    }
                    startBtn.textContent = "Pauzeren";
                    workInput.disabled = true; breakInput.disabled = true;
                    activeTimerInterval = setInterval(tick, 1000);
                } else {
                    startBtn.textContent = "Start";
                    clearInterval(activeTimerInterval); activeTimerInterval = null;
                }
            });
            modal.querySelector("#timerResetBtn").addEventListener("click", () => {
                running = false; startBtn.textContent = "Start";
                clearInterval(activeTimerInterval); activeTimerInterval = null;
                workInput.disabled = false; breakInput.disabled = false;
                sessionSeconds = 0; periodFresh = true;
                workMin = Number(workInput.value) || 25; breakMin = Number(breakInput.value) || 5;
                remaining = (mode === "work" ? workMin : breakMin) * 60;
                updateDisplay();
            });
            modal.querySelector("#timerCloseBtn").addEventListener("click", () => {
                clearInterval(activeTimerInterval); activeTimerInterval = null;
                if (mode === "work" && sessionSeconds >= 60) {
                    addActualMinutes(task.id, Math.floor(sessionSeconds / 60));
                    if (onLog) onLog();
                }
                closeModal();
                refreshAll();
            });
            updateDisplay();
        },
        onClose: () => { if (activeTimerInterval) { clearInterval(activeTimerInterval); activeTimerInterval = null; } },
    });
}

// ---------------------------------------------------------------------------
// Tab: Lijst
// ---------------------------------------------------------------------------
function renderListTab() {
    const el = document.getElementById("tab-list");
    el.innerHTML = `
      <div class="search-row">
        <input type="text" id="listSearch" placeholder="\u{1F50D} Zoeken op titel of vak..." value="${escapeHtml(listSearchQuery)}">
        <button class="btn" id="listSearchClear">Wissen</button>
      </div>
      <div id="listTableWrap"></div>
    `;
    const searchInput = el.querySelector("#listSearch");
    function renderTable() {
        const rows = getAllPlannedSessions().filter(r => {
            if (!listSearchQuery) return true;
            const q = listSearchQuery.toLowerCase();
            return r.title.toLowerCase().includes(q) || getSubjectName(r.subjectId).toLowerCase().includes(q);
        });
        el.querySelector("#listTableWrap").innerHTML = `
          <div class="table-scroll">
          <table class="data-table">
            <thead><tr><th>Datum</th><th>Tijd</th><th>Vak</th><th>Titel</th><th>Duur</th><th></th></tr></thead>
            <tbody>${rows.length ? rows.map(r => {
                const urg = deadlineUrgency(r.deadline);
                const rowClass = urg === "overdue" ? "row-overdue" : urg === "soon" ? "row-soon" : "";
                const flag = urg === "overdue" ? "\u26A0 " : urg === "soon" ? "\u23F0 " : "";
                return `<tr class="${rowClass}">
              <td>${fmtDate(r.date)}</td><td>${r.time}</td>
              <td>${escapeHtml(getSubjectName(r.subjectId))}</td><td>${flag}${escapeHtml(r.title)}</td>
              <td>${r.minutes} min</td>
              <td><button class="btn btn-sm" data-action="mark-done" data-task-id="${r.taskId}" data-session-id="${r.sessionId}">Klaar</button></td>
            </tr>`;
            }).join("") : '<tr><td colspan="6" class="empty-state">Geen ingeplande taken gevonden.</td></tr>'}</tbody>
          </table>
          </div>
        `;
        el.querySelectorAll('[data-action="mark-done"]').forEach(b => b.addEventListener("click", () => {
            toggleSessionDone(Number(b.dataset.taskId), Number(b.dataset.sessionId)); refreshAll(); showToast("Gemarkeerd als klaar");
        }));
    }
    searchInput.addEventListener("input", (e) => { listSearchQuery = e.target.value; renderTable(); });
    el.querySelector("#listSearchClear").addEventListener("click", () => { listSearchQuery = ""; searchInput.value = ""; renderTable(); });
    renderTable();
}

// ---------------------------------------------------------------------------
// Tab: Deze week gedaan
// ---------------------------------------------------------------------------
function renderCompletedTab() {
    const el = document.getElementById("tab-completed");
    const sunday = addDays(completedMonday, 6);
    const rows = getCompletedTasksBetween(completedMonday, sunday);
    let totalMinutes = 0, anyActual = false;
    const subjectMinutes = {};
    rows.forEach(t => {
        const eff = t.actualMinutes ? t.actualMinutes : t.completedMinutes;
        if (t.actualMinutes) anyActual = true;
        totalMinutes += eff;
        const name = getSubjectName(t.subjectId);
        const entry = subjectMinutes[name] || { minutes: 0, color: getSubjectColor(t.subjectId) };
        entry.minutes += eff;
        subjectMinutes[name] = entry;
    });
    const chartData = Object.entries(subjectMinutes).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.minutes - a.minutes);
    const maxMinutes = Math.max(1, ...chartData.map(c => c.minutes));

    el.innerHTML = `
      <div class="cal-nav">
        <button class="btn btn-sm" id="cPrev">&larr; Vorige week</button>
        <button class="btn btn-sm" id="cToday">Deze week</button>
        <button class="btn btn-sm" id="cNext">Volgende week &rarr;</button>
        <span class="cal-range">${fmtDate(completedMonday)} \u2013 ${fmtDate(sunday)}</span>
      </div>
      <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Dag</th><th>Tijd</th><th>Vak</th><th>Taak</th><th>Geschat</th><th>Werkelijk</th></tr></thead>
        <tbody>${rows.length ? rows.map(t => {
            const wd = weekdayIndex(t.completedAt);
            const timeLabel = t.sessionTime ? t.sessionTime : (t.sessionCount > 1 ? `${t.sessionCount} sessies` : "-");
            return `<tr>
              <td>${DAY_NAMES[wd]} ${t.completedAt.slice(8, 10)}/${t.completedAt.slice(5, 7)}</td>
              <td>${timeLabel}</td><td>${escapeHtml(getSubjectName(t.subjectId))}</td>
              <td>${escapeHtml(t.title)}</td><td>${t.completedMinutes} min</td>
              <td>${t.actualMinutes ? t.actualMinutes + " min" : "-"}</td>
            </tr>`;
        }).join("") : '<tr><td colspan="6" class="empty-state">Nog geen taken afgewerkt deze week.</td></tr>'}</tbody>
      </table>
      </div>
      <div class="total-line">${rows.length ? `Totaal deze week: ${rows.length} taken afgewerkt, samen ${Math.floor(totalMinutes / 60)}u${String(totalMinutes % 60).padStart(2, "0")}m${anyActual ? " (werkelijke tijd waar gelogd, anders geschat)" : " (geschat)"}.` : ""}</div>
      <h3 class="section-title">Tijd per vak deze week</h3>
      <div class="chart-wrap">
        ${chartData.length ? chartData.map(c => {
            const h = Math.max(6, Math.round((c.minutes / maxMinutes) * 140));
            const hh = Math.floor(c.minutes / 60), mm = c.minutes % 60;
            return `<div class="chart-bar-group">
              <div class="chart-value">${hh ? hh + "u" : ""}${String(mm).padStart(2, "0")}m</div>
              <div class="chart-bar" style="height:${h}px; background:${c.color}"></div>
              <div class="chart-label">${escapeHtml(c.name)}</div>
            </div>`;
        }).join("") : '<div class="empty-state">Nog geen data deze week.</div>'}
      </div>
    `;
    el.querySelector("#cPrev").addEventListener("click", () => { completedMonday = addDays(completedMonday, -7); renderCompletedTab(); });
    el.querySelector("#cNext").addEventListener("click", () => { completedMonday = addDays(completedMonday, 7); renderCompletedTab(); });
    el.querySelector("#cToday").addEventListener("click", () => { completedMonday = weekStart(isoFromDate(new Date())); renderCompletedTab(); });
}

function openTipsModal() {
    openModal(`
      <p class="quote-line">\u201cEen tocht van duizend mijl begint met een enkele stap.\u201d <span class="quote-author">\u2014 Lao Tzu, Tao Te Ching</span></p>

      <h3 class="section-title">Waarom voelt plannen soms zo zwaar?</h3>
      <ul class="tips-list">
        <li>Het stukje van je hersenen dat plant en vooruitkijkt, is nog volop aan het groeien \u2014 dat wordt pas rond je midden-twintiger jaren echt "af". Als dit moeilijk voelt, is dat dus geen persoonlijk falen, maar gewoon waar je nu in je ontwikkeling staat.</li>
        <li>Een grote, vage taak ("studeren voor de toets") voelt bedreigender dan ze is. Uitstellen geeft even een opgelucht gevoel, maar hoe langer je wacht, hoe groter de taak in je hoofd lijkt te worden.</li>
        <li>Iedereen \u2014 ook volwassenen \u2014 is slecht in inschatten hoe lang iets duurt. Dat is een bekend, heel normaal verschijnsel, geen persoonlijke zwakte.</li>
        <li>Directe dingen (je telefoon, vrienden, een spelletje) voelen véél aantrekkelijker dan iets waarvan de beloning (een goed cijfer) pas over twee weken komt. Dat is gewoon hoe hersenen werken, niet iets waar je "beter" in moet zijn.</li>
      </ul>

      <h3 class="section-title">Wat levert het je op?</h3>
      <ul class="tips-list">
        <li>Minder van dat vage, knagende "ik zou eigenlijk moeten..."-gevoel op de achtergrond.</li>
        <li>Je hoeft niet steeds opnieuw te beslissen wat je nu moet doen \u2014 dat is al beslist, je moet het gewoon uitvoeren.</li>
        <li>Grote taken voelen minder eng als je ze opdeelt in kleine, concrete stapjes.</li>
        <li>Je leert jezelf beter kennen: hoe lang iets echt duurt, wanneer je het beste werkt.</li>
        <li>Het is een vaardigheid die je overal in je leven zal gebruiken, niet enkel op school.</li>
      </ul>

      <h3 class="section-title">Concrete tips</h3>
      <ul class="tips-list">
        <li><strong>\u00c9\u00e9n vast moment per dag</strong> (bv. net na het laatste belsignaal) om Smartschool over te zetten naar de planner \u2014 niet steeds opnieuw tussendoor.</li>
        <li><strong>Niet alles overtypen.</strong> Enkel wat echt tijd vraagt (toetsen, taken, grote opdrachten) \u2014 elke kleine mededeling erin zetten maakt de lijst snel overweldigend.</li>
        <li><strong>Begin klein.</strong> Eerst gewoon vandaag en morgen goed plannen, niet meteen de hele week perfect.</li>
        <li><strong>Maak een taak concreet.</strong> "Hoofdstuk 3, bladzijde 12-18 lezen" werkt beter dan gewoon "studeren".</li>
        <li><strong>Een gemiste dag is geen ramp.</strong> Gewoon de volgende dag terug oppikken \u2014 dat is waardevoller dan proberen alles perfect te laten lopen.</li>
        <li><strong>Duurde iets langer dan gepland?</strong> Dat is informatie, geen falen \u2014 zo leer je jezelf beter inschatten voor de volgende keer.</li>
      </ul>
      <div class="modal-actions">
        <button class="btn btn-primary" data-close>Begrepen</button>
      </div>
    `, { onMount: (modal) => {
        modal.querySelector("[data-close]").addEventListener("click", closeModal);
    }});
}
